<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon — Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #08090c; --surface: #0f1116; --surface-2: #14171e;
            --line: #1e232d; --line-hi: #2a3140;
            --text: #e8ecf2; --text-dim: #7b8493; --text-mute: #4d5563;
            --accent: #4cc9f0; --accent-dim: #1d6d85;
            --red: #ff4757; --blue: #3a86ff; --success: #2ec4b6;
        }
        body.light-mode {
            --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f0f2f5;
            --line: #e1e4ea; --line-hi: #cfd4dc;
            --text: #111318; --text-dim: #5c6575; --text-mute: #8b94a5;
            --accent: #0088cc; --accent-dim: #005f8f;
        }
        body {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; height: 100dvh; overflow: hidden; -webkit-font-smoothing: antialiased;
            user-select: none; transition: background 0.3s, color 0.3s;
        }
        
        .shell {
            position: relative; z-index: 1; display: flex;
            width: 100%; max-width: 1180px; height: 92vh;
            margin: 4vh auto; background: var(--surface);
            border: 1px solid var(--line); border-radius: 14px;
            overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        
        /* SIDEBAR */
        .sidebar {
            width: 340px; display: flex; flex-direction: column;
            background: var(--bg); border-right: 1px solid var(--line); flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .me { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
        .me-info { flex: 1; min-width: 0; }
        .me-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .me-phone { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); margin-top: 2px; }
        .me-actions { display: flex; gap: 6px; }
        .icon-btn {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            background: transparent; border: 1px solid var(--line); border-radius: 7px;
            color: var(--text-dim); cursor: pointer; transition: all 0.15s; text-decoration: none;
        }
        .icon-btn:hover { border-color: var(--line-hi); color: var(--text); background: var(--surface-2); }
        .icon-btn svg { width: 15px; height: 15px; }
        .icon-btn.danger:hover { border-color: var(--red); color: var(--red); }
        .icon-btn.owner-active { border-color: var(--red); color: var(--red); }
        
        .search { padding: 14px 20px; border-bottom: 1px solid var(--line); }
        .search-input-wrap { position: relative; }
        .search-input-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-mute); pointer-events: none; }
        .search input {
            width: 100%; padding: 9px 12px 9px 32px; background: var(--bg);
            border: 1px solid var(--line); border-radius: 7px; color: var(--text);
            font-family: inherit; font-size: 13px; outline: none; transition: border-color 0.15s;
        }
        .search input::placeholder { color: var(--text-mute); }
        .search input:focus { border-color: var(--accent-dim); }
        .search-hint { font-size: 10.5px; color: var(--text-mute); margin-top: 8px; line-height: 1.4; }
        
        .search-result {
            display: none; margin: 0 20px 12px; padding: 10px 12px;
            background: var(--surface-2); border: 1px solid var(--accent-dim);
            border-radius: 8px; cursor: pointer; align-items: center; gap: 10px; transition: background 0.15s;
        }
        .search-result.show { display: flex; }
        .search-result:hover { background: var(--line); }
        .search-result .empty-msg { font-size: 12px; color: var(--text-dim); }
        
        .list-scroll { flex: 1; overflow-y: auto; padding: 4px 0; }
        .list-scroll::-webkit-scrollbar { width: 4px; }
        .list-scroll::-webkit-scrollbar-thumb { background: var(--line-hi); border-radius: 2px; }
        .list-label {
            padding: 12px 20px 6px; font-size: 10px; text-transform: uppercase;
            letter-spacing: 1.2px; color: var(--text-mute); font-weight: 600;
        }
        .user-item {
            padding: 11px 20px; display: flex; align-items: center; gap: 11px;
            cursor: pointer; border-left: 2px solid transparent; transition: background 0.12s, border-color 0.12s;
        }
        .user-item:hover { background: var(--surface-2); }
        .user-item.active { background: var(--surface-2); border-left-color: var(--accent); }
        .user-meta { min-width: 0; flex: 1; }
        .user-name {
            font-weight: 500; font-size: 13.5px; color: var(--text);
            display: flex; align-items: center; gap: 5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-phone { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-dim); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
        .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; flex-shrink: 0; }
        .online-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
        
        .avatar {
            width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2);
            border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 14px; color: var(--accent);
            flex-shrink: 0; overflow: hidden; background-size: cover; background-position: center;
        }
        .badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0;
        }
        .badge svg { width: 9px; height: 9px; color: #fff; }
        .badge.red { background: var(--red); }
        .badge.blue { background: var(--blue); }
        
        /* CHAT AREA */
        .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
        .empty {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 14px; color: var(--text-mute);
        }
        .empty svg { width: 44px; height: 44px; color: var(--line-hi); }
        .empty p { font-size: 13.5px; }
        
        .chat-head {
            padding: 14px 22px; border-bottom: 1px solid var(--line);
            display: none; align-items: center; gap: 12px; background: var(--surface);
            flex-shrink: 0;
        }
        .chat-head.show { display: flex; }
        
        /* Tombol Back (Cuma muncul di HP) */
        .back-btn { display: none; background: transparent; border: none; color: var(--text); cursor: pointer; padding: 5px; margin-left: -5px; }
        .back-btn svg { width: 20px; height: 20px; }

        .chat-head-info { flex: 1; min-width: 0; }
        .chat-head-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .chat-head-phone { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
        
        .messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 6px; }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: var(--line-hi); border-radius: 3px; }
        
        /* BUBBLE CHAT */
        .msg {
            max-width: 75%; padding: 10px 14px; font-size: 13.5px;
            line-height: 1.5; border-radius: 14px; word-wrap: break-word; white-space: pre-wrap;
            cursor: pointer; transition: opacity 0.2s; position: relative;
            display: flex; flex-direction: column;
        }
        .msg:active { opacity: 0.7; }
        .msg.mine { align-self: flex-end; background: var(--accent); color: #04121a; font-weight: 500; border-bottom-right-radius: 4px; }
        .msg.theirs { align-self: flex-start; background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
        
        /* Reply UI */
        .reply-preview {
            background: rgba(0,0,0,0.1); border-left: 3px solid rgba(0,0,0,0.3);
            padding: 6px 10px; border-radius: 4px; margin-bottom: 6px;
            font-size: 12px; opacity: 0.8;
        }
        .msg.theirs .reply-preview { background: rgba(255,255,255,0.05); border-left-color: var(--accent); }
        
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
        .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 4px; font-size: 10px; opacity: 0.7; }
        .check-svg { width: 14px; height: 14px; }

        /* Voice Note UI */
        .vn-container { display: flex; align-items: center; gap: 12px; min-width: 200px; padding: 4px; }
        .vn-play-btn {
            width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer;
        }
        .msg.mine .vn-play-btn { background: rgba(0,0,0,0.15); color: #04121a; }
        .msg.theirs .vn-play-btn { background: rgba(255,255,255,0.1); color: var(--accent); }
        .vn-play-btn svg { width: 14px; height: 14px; fill: currentColor; }
        .vn-waveform { flex: 1; height: 20px; display: flex; align-items: center; gap: 2px; position: relative; opacity: 0.6; }
        .vn-waveform .bar { width: 3px; background: currentColor; border-radius: 2px; }
        .vn-duration { font-size: 11px; font-family: 'JetBrains Mono', monospace; opacity: 0.8; }
        .msg.mine .vn-duration { color: #04121a; }
        .vn-hidden-audio { display: none !important; }

        /* COMPOSER (INPUT) */
        .composer {
            padding: 10px 15px; border-top: 1px solid var(--line);
            display: none; gap: 8px; background: var(--surface); align-items: center;
            position: relative; flex-wrap: wrap; flex-shrink: 0;
        }
        .composer.show { display: flex; }
        
        .reply-bar {
            width: 100%; padding: 8px 12px; background: var(--surface-2);
            border-left: 3px solid var(--accent); border-radius: 6px;
            display: none; justify-content: space-between; align-items: center;
            font-size: 12px; color: var(--text-dim); margin-bottom: 5px;
        }
        .reply-bar.show { display: flex; }
        .reply-bar-close { cursor: pointer; color: var(--red); font-weight: bold; }

        .composer input[type="text"] {
            flex: 1; padding: 11px 15px; background: var(--bg); min-width: 100px;
            border: 1px solid var(--line); border-radius: 9px; color: var(--text);
            font-family: inherit; font-size: 16px; outline: none; transition: border-color 0.15s;
        }
        .composer input[type="text"]:focus { border-color: var(--accent-dim); }
        .composer input[type="text"]::placeholder { color: var(--text-mute); font-size: 14px; }
        
        .action-btn {
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: transparent; border: 1px solid var(--line); border-radius: 9px;
            color: var(--text-dim); cursor: pointer; transition: all 0.15s; flex-shrink: 0;
        }
        .action-btn:hover { border-color: var(--accent-dim); color: var(--accent); background: var(--surface-2); }
        .action-btn svg { width: 18px; height: 18px; }
        .action-btn.recording { background: var(--red); border-color: var(--red); color: #fff; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        input[type="file"] { display: none; }

        .send-btn {
            padding: 0 16px; height: 40px; background: var(--accent); border: none; border-radius: 9px;
            color: #04121a; font-family: inherit; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center;
        }
        .send-btn svg { width: 16px; height: 16px; display: none; }
        .send-btn span { display: inline; }
        .send-btn:hover { background: #6ad5f5; }
        .send-btn:active { transform: scale(0.97); }

        /* CONTEXT MENU */
        .ctx-menu {
            position: fixed; z-index: 99999; background: var(--surface);
            border: 1px solid var(--line-hi); border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); padding: 6px;
            display: none; min-width: 180px; animation: popIn 0.1s ease-out;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .ctx-menu.show { display: block; }
        .ctx-item {
            padding: 9px 12px; border-radius: 5px; cursor: pointer; font-size: 13px;
            color: var(--text); display: flex; align-items: center; gap: 8px; transition: background 0.15s;
        }
        .ctx-item:hover { background: var(--surface-2); }
        .ctx-item.danger { color: var(--red); }
        .ctx-item.danger:hover { background: rgba(255, 71, 87, 0.1); }
        .ctx-item svg { width: 14px; height: 14px; }

        /* MODAL (TENGAH LAYAR) */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 100000;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; animation: fadeIn 0.15s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-box {
            background: var(--surface); border: 1px solid var(--line-hi);
            border-radius: 12px; padding: 24px; max-width: 340px; width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9); animation: slideUp 0.2s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-title { font-weight: 600; font-size: 16px; margin-bottom: 8px; color: var(--text); }
        .modal-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-cancel {
            padding: 9px 16px; background: transparent; border: 1px solid var(--line-hi);
            border-radius: 7px; color: var(--text); font-family: inherit; font-weight: 500;
            font-size: 13px; cursor: pointer; transition: all 0.15s;
        }
        .btn-cancel:hover { background: var(--surface-2); }
        .btn-confirm-del {
            padding: 9px 16px; background: var(--red); border: none;
            border-radius: 7px; color: #fff; font-family: inherit; font-weight: 600;
            font-size: 13px; cursor: pointer; transition: all 0.15s;
        }
        .btn-confirm-del:hover { background: #ff6b77; }

        /* === RESPONSIVE UNTUK HP === */
        @media (max-width: 768px) {
            .shell {
                height: 100vh; height: 100dvh; margin: 0; border-radius: 0; border: none; max-width: 100%;
                position: relative; overflow: hidden;
            }
            
            /* Sidebar jadi full screen & nimpa chat */
            .sidebar {
                width: 100%; border-right: none;
                position: absolute; inset: 0; z-index: 10;
                transform: translateX(-100%);
            }
            body.show-chat .sidebar { transform: translateX(-100%); }
            body:not(.show-chat) .sidebar { transform: translateX(0); }
            
            /* Chat area jadi full screen */
            .chat {
                position: absolute; inset: 0; z-index: 20;
                transform: translateX(100%);
                transition: transform 0.3s ease;
            }
            body.show-chat .chat { transform: translateX(0); }
            
            /* Tombol back muncul */
            .back-btn { display: block; }
            
            /* Sesuaiin padding & font */
            .me { padding: 15px; }
            .messages { padding: 15px; }
            .msg { max-width: 85%; font-size: 14px; }
            .composer { padding: 10px; gap: 6px; }
            
            /* Kirim jadi ikon aja biar gak makan tempat */
            .send-btn span { display: none; }
            .send-btn svg { display: block; }
            .send-btn { width: 40px; padding: 0; }
            
            /* Action button jadi lebih kecil dikit */
            .action-btn { width: 36px; height: 36px; }
            .action-btn svg { width: 16px; height: 16px; }
            
            .vn-container { min-width: 180px; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="sidebar">
            <div class="me">
                <div class="avatar" id="myAvatar"></div>
                <div class="me-info">
                    <div class="me-name" id="myName">Loading</div>
                    <div class="me-phone" id="myPhone">—</div>
                </div>
                <div class="me-actions">
                    <a href="profile.html" class="icon-btn" title="Edit profil">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    </a>
                    <button class="icon-btn" id="themeBtn" title="Ganti Tema">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    </button>
                    <a href="owner.html" class="icon-btn owner-active" id="ownerBtn" style="display:none;" title="Panel owner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7l3-7z"/></svg>
                    </a>
                    <button class="icon-btn danger" id="logoutBtn" title="Keluar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </div>
            </div>

            <div class="search">
                <div class="search-input-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <input type="text" id="searchInput" placeholder="Cari nomor atau nama">
                </div>
                <div class="search-hint" id="searchHint">Ketik nomor lengkap untuk menemukan pengguna lain</div>
            </div>

            <div class="search-result" id="searchResult"></div>

            <div class="list-scroll" id="userList">
                <div style="padding: 20px; text-align: center; color: var(--text-mute); font-size: 12px;">Memuat</div>
            </div>
        </aside>

        <main class="chat" id="mainChat">
            <div class="empty" id="emptyChat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                <p>Pilih percakapan untuk mulai</p>
            </div>

            <div class="chat-head" id="chatHeader">
                <button class="back-btn" id="backBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                </button>
                <div class="avatar" id="chatAvatar"></div>
                <div class="chat-head-info">
                    <div class="chat-head-name" id="chatName">—</div>
                    <div class="chat-head-phone" id="chatPhone">—</div>
                </div>
                <button class="icon-btn danger" id="clearChatBtn" title="Hapus Semua Chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                </button>
            </div>

            <div class="messages" id="messages"></div>

            <div class="composer" id="composer">
                <div class="reply-bar" id="replyBar">
                    <div style="min-width: 0;">
                        <div style="font-size: 10px; color: var(--accent); font-weight: bold;">Membalas pesan:</div>
                        <div id="replyText" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
                    </div>
                    <span class="reply-bar-close" id="cancelReply">✕</span>
                </div>

                <button class="action-btn" id="attachBtn" title="Kirim Gambar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <input type="file" id="fileInput" accept="image/*">

                <button class="action-btn" id="recordBtn" title="Rekam Suara">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>

        function normalizeText(text) {
            return text.toLowerCase()
                .replace(/[0@]/g, 'o').replace(/[1!|]/g, 'i').replace(/3/g, 'e')

        function detectToxic(text) {
            const norm = normalizeText(text);
            const words = norm.split(' ');

            TOXIC_WORDS.forEach(w => {
                if (words.includes(w) || norm.includes(w)) {
                    if (!matched.includes(w)) matched.push(w);
                }
            });
            if (matched.length === 0) return { matched: [], severity: null };
            const isHigh = matched.some(w => HIGH_SEVERITY_WORDS.includes(w));
            return { matched, severity: isHigh ? 'high' : 'low' };
        }

        function playNotifSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) { console.error("Audio error:", e); }
        }

        function setupAudioPlayer(container) {
            const btn = container.querySelector('.vn-play-btn');
            const audio = container.querySelector('.vn-hidden-audio');
            const durationText = container.querySelector('.vn-duration');
            const bars = container.querySelectorAll('.vn-waveform .bar');
            
            audio.addEventListener('loadedmetadata', () => {
                const mins = Math.floor(audio.duration / 60);
                const secs = Math.floor(audio.duration % 60);
                durationText.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            });

            btn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                document.querySelectorAll('.vn-hidden-audio').forEach(a => {
                    if (a !== audio) { a.pause(); a.currentTime = 0; }
                    const otherBtn = a.closest('.vn-container')?.querySelector('.vn-play-btn');
                    if (otherBtn) otherBtn.innerHTML = PLAY_SVG;
                });

                if (audio.paused) {
                    audio.play();
                    btn.innerHTML = PAUSE_SVG;
                } else {
                    audio.pause();
                    btn.innerHTML = PLAY_SVG;
                }
            });

            audio.addEventListener('timeupdate', () => {
                const progress = (audio.currentTime / audio.duration);
                const activeBars = Math.floor(progress * bars.length);
                bars.forEach((bar, i) => {
                    bar.style.opacity = i <= activeBars ? '1' : '0.3';
                });
            });

            audio.addEventListener('ended', () => {
                btn.innerHTML = PLAY_SVG;
                bars.forEach(bar => bar.style.opacity = '0.3');
            });
        }

        document.getElementById('ctxDeleteAll').addEventListener('click', () => {
            ctxMenu.classList.remove('show');
            showModal('Hapus untuk semua?', 'Pesan ini akan hilang dari layar kamu dan lawan bicara.', 'Hapus', 'danger', async () => {
                const m = activeMessage;
                const el = document.querySelector(`.msg[data-id="${m.id}"]`);
                await sb.from('messages').update({ content: '[Pesan ini telah dihapus]' }).eq('id', m.id);
                if (el) el.style.display = 'none';
            });
        });

        document.getElementById('ctxDeleteMe').addEventListener('click', () => {
            ctxMenu.classList.remove('show');
            showModal('Hapus pesan?', 'Pesan ini hanya akan hilang dari layar kamu sendiri.', 'Hapus', 'danger', async () => {
                const m = activeMessage;
                const el = document.querySelector(`.msg[data-id="${m.id}"]`);
                await sb.from('message_deletions').insert({ message_id: m.id, user_id: currentUser.id });
                if (el) el.remove();
            });
        });

        // === CLEAR CHAT ===
        document.getElementById('clearChatBtn').addEventListener('click', () => {
            if (!currentChatUser) return;
            showModal('Hapus Semua Chat?', 'Seluruh riwayat chat di room ini akan dihapus dari layar kamu.', 'Hapus Semua', 'danger', async () => {
                const { data: msgs } = await sb.from('messages')
                    .select('id')
                    .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser.id}),and(sender_id.eq.${currentChatUser.id},receiver_id.eq.${currentUser.id})`);
                
                if (msgs && msgs.length > 0) {
                    const inserts = msgs.map(m => ({ message_id: m.id, user_id: currentUser.id }));
                    await sb.from('message_deletions').insert(inserts);
                    document.getElementById('messages').innerHTML = '';
                }
            });
        });

        // === UPLOAD GAMBAR ===
        document.getElementById('attachBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !currentChatUser) return;
            
            const ext = file.name.split('.').pop();
            const fileName = `${currentUser.id}/${Date.now()}.${ext}`;
            
            const { error: upErr } = await sb.storage.from('chat_uploads').upload(fileName, file);
            if (upErr) {
                showModal('Gagal Upload', upErr.message, 'Tutup', 'primary', null);
                return;
            }
            
            const { data: urlData } = sb.storage.from('chat_uploads').getPublicUrl(fileName);
            
            await sb.from('messages').insert({
                sender_id: currentUser.id,
                receiver_id: currentChatUser.id,
                content: '',
                file_url: urlData.publicUrl,
                file_type: 'image',
                reply_to_id: replyingTo ? replyingTo.id : null
            });

            cancelReply();
            e.target.value = ''; 
        });

        // === REKAM VN ===
        const recordBtn = document.getElementById('recordBtn');
        
        recordBtn.addEventListener('click', async () => {
            if (!currentChatUser) return;

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const fileName = `${currentUser.id}/${Date.now()}.webm`;
                        
                        recordBtn.classList.remove('recording');
                        isRecording = false;
                        recordBtn.title = "Rekam Suara";

                        const { error: upErr } = await sb.storage.from('chat_uploads').upload(fileName, audioBlob);
                        if (upErr) {
                            showModal('Gagal Upload VN', upErr.message, 'Tutup', 'primary', null);
                            return;
                        }

                        const { data: urlData } = sb.storage.from('chat_uploads').getPublicUrl(fileName);
                        
                        await sb.from('messages').insert({
                            sender_id: currentUser.id,
                            receiver_id: currentChatUser.id,
                            content: '',
                            file_url: urlData.publicUrl,
                            file_type: 'audio',
                            reply_to_id: replyingTo ? replyingTo.id : null
                        });

                        cancelReply();
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    recordBtn.title = "Merekam... Klik lagi buat kirim";

                    recordingTimeout = setTimeout(() => {
                        if (isRecording) mediaRecorder.stop();
                    }, 60000);

                } catch (err) {
                    showModal('Akses Ditolak', 'Pastikan lo ngasih izin mikrofon di browser.', 'Tutup', 'primary', null);
                }
            } else {
                clearTimeout(recordingTimeout);
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }
            }
        });

        // === KIRIM PESAN ===
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !currentChatUser) return;
            
            input.value = '';
            const { matched, severity } = detectToxic(content);
            
            if (matched.length > 0) {
                await sb.from('moderation_logs').insert({
                    sender_id: currentUser.id,
                    receiver_id: currentChatUser.id,
                    content: content,
                    matched_words: matched,
                    severity: severity
                });
                if (severity === 'high') showToxicWarning();
            }

            const { error: insErr } = await sb.from('messages').insert({
                sender_id: currentUser.id,
                receiver_id: currentChatUser.id,
                content,
                reply_to_id: replyingTo ? replyingTo.id : null
            });

            if (insErr) console.error('Gagal kirim pesan:', insErr);
            cancelReply();
        }

        function showToxicWarning() {
            const existing = document.getElementById('toxicWarn');
            if (existing) existing.remove();
            const warn = document.createElement('div');
            warn.id = 'toxicWarn';
            warn.textContent = 'Pesanmu terdeteksi mengandung kata tidak pantas. Pesan ini dicatat.';
            warn.style.cssText = `
                position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
                background: #1f1116; border: 1px solid #ff4757; color: #ff8a94;
                padding: 10px 16px; border-radius: 8px; font-size: 12px;
                font-family: 'Space Grotesk', sans-serif; z-index: 9999;
                box-shadow: 0 8px 24px rgba(255,71,87,0.25);
                max-width: 90%; text-align: center; pointer-events: none;
            `;
            document.body.appendChild(warn);
            setTimeout(() => warn.remove(), 4000);
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await sb.auth.signOut();
            window.location.href = 'index.html';
        });

        init();
    </script>
</body>
</html>
