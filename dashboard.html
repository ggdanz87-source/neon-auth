<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — Zerozx Neon</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #050508; --card: rgba(10, 10, 15, 0.8); --border: rgba(0, 150, 255, 0.2);
            --text: #e0e0e0; --text-dim: #7a7a85; --neon: #00d4ff; --neon-dark: #0088cc;
            --red: #e53935; --blue: #1e88e5;
        }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
            height: 100vh; display: flex; overflow: hidden;
        }
        .bg-wrap { position: fixed; inset: 0; z-index: 0; }
        .neon-blob { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4; animation: floatBlob 15s infinite alternate; }
        .blob-a { width: 400px; height: 400px; background: #00d4ff; top: -100px; left: -100px; }
        .blob-b { width: 300px; height: 300px; background: #0055ff; bottom: -50px; right: -50px; }
        @keyframes floatBlob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(100px, 50px) scale(1.2); } }
        
        .chat-layout {
            position: relative; z-index: 1; display: flex; width: 100%; max-width: 1200px; height: 90vh; margin: auto;
            background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; overflow: hidden;
        }

        .sidebar { width: 340px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: rgba(0,0,0,0.3); }
        .sidebar-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .user-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .avatar {
            width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, var(--neon-dark), var(--neon));
            display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000;
            overflow: hidden; background-size: cover; background-position: center; flex-shrink: 0;
        }
        .my-id { font-size: 12px; color: var(--neon); font-weight: bold; }
        
        .btn-edit { color: var(--neon); border: 1px solid var(--neon); padding: 6px 10px; border-radius: 5px; text-decoration: none; font-size: 11px; font-weight: bold; margin-right: 5px;}
        .btn-edit:hover { background: var(--neon); color: #000; }
        .logout-btn { background: transparent; border: 1px solid #ff4444; color: #ff4444; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold;}
        .logout-btn:hover { background: #ff4444; color: #000; }

        .search-box { padding: 15px; position: relative; }
        .search-box input {
            width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            border-radius: 8px; color: #fff; font-family: inherit; outline: none;
        }
        .search-box input:focus { border-color: var(--neon); }
        .search-hint { font-size: 10px; color: var(--text-dim); margin-top: 6px; padding: 0 4px; }

        /* Hasil search (khusus user biasa) */
        .search-result {
            margin: 0 15px 10px; padding: 12px; border-radius: 10px;
            background: rgba(0, 212, 255, 0.08); border: 1px solid var(--neon);
            display: none; align-items: center; gap: 12px; cursor: pointer;
        }
        .search-result:hover { background: rgba(0, 212, 255, 0.15); }
        .search-result.show { display: flex; }
        
        .user-list { flex: 1; overflow-y: auto; }
        .list-label { padding: 10px 20px 5px; font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .user-item {
            padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 12px;
        }
        .user-item:hover, .user-item.active { background: rgba(0, 212, 255, 0.1); border-left: 3px solid var(--neon); }
        .user-name { font-weight: 600; color: #fff; font-size: 14px; display: flex; align-items: center; }
        .user-phone { font-size: 11px; color: var(--text-dim); }

        .badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; border-radius: 50%;
            font-size: 10px; color: #fff; font-weight: bold;
            margin-left: 4px; flex-shrink: 0;
        }
        .badge-red  { background: var(--red); box-shadow: 0 0 6px rgba(229,57,53,0.6); }
        .badge-blue { background: var(--blue); box-shadow: 0 0 6px rgba(30,136,229,0.6); }

        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .empty-chat { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-dim); }
        
        .chat-header {
            padding: 15px 20px; border-bottom: 1px solid var(--border); display: none; align-items: center; gap: 15px;
        }
        .chat-header.active { display: flex; }
        .chat-header .user-name { font-size: 16px; }
        
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 70%; padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.4; }
        .message.mine { align-self: flex-end; background: linear-gradient(135deg, var(--neon-dark), var(--neon)); color: #000; border-bottom-right-radius: 2px; font-weight: 500; }
        .message.theirs { align-self: flex-start; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; border-bottom-left-radius: 2px; }
        
        .chat-input-area { padding: 15px; border-top: 1px solid var(--border); display: none; gap: 10px; }
        .chat-input-area.active { display: flex; }
        .chat-input-area input {
            flex: 1; padding: 12px 15px; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            border-radius: 10px; color: #fff; font-family: inherit; outline: none;
        }
        .chat-input-area button {
            padding: 0 25px; background: var(--neon); border: none; border-radius: 10px; font-weight: bold; cursor: pointer;
            color: #000; transition: 0.2s;
        }
        .chat-input-area button:hover { box-shadow: 0 0 15px var(--neon); }
    </style>
</head>
<body>
    <div class="bg-wrap">
        <div class="neon-blob blob-a"></div>
        <div class="neon-blob blob-b"></div>
    </div>

    <div class="chat-layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <div class="avatar" id="myAvatar">?</div>
                    <div style="min-width:0;">
                        <div class="user-name" id="myName">Loading...</div>
                        <div class="my-id" id="myPhone">-</div>
                    </div>
                </div>
                <div style="display:flex; align-items:center;">
                    <a href="profile.html" class="btn-edit">Edit</a>
                    <a href="owner.html" class="btn-edit" id="ownerBtn" style="display:none; color:var(--red); border-color:var(--red);">Owner</a>
                    <button class="logout-btn" id="logoutBtn">Out</button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari nomor (08xxxx...) atau nama...">
                <div class="search-hint" id="searchHint">Ketik nomor lengkap buat nemu user lain</div>
            </div>

            <!-- Hasil search (muncul di sini) -->
            <div class="search-result" id="searchResult"></div>

            <div class="user-list" id="userList">
                <div style="padding: 20px; text-align: center; color: var(--text-dim); font-size: 12px;">Memuat...</div>
            </div>
        </div>

        <div class="chat-area">
            <div class="empty-chat" id="emptyChat">
                <div style="font-size: 50px; margin-bottom: 10px;">💬</div>
                <p>Pilih user untuk mulai chat</p>
            </div>

            <div class="chat-header" id="chatHeader">
                <div class="avatar" id="chatAvatar">?</div>
                <div>
                    <div class="user-name" id="chatName">-</div>
                    <div style="font-size: 11px; color: var(--neon);" id="chatPhone">-</div>
                </div>
            </div>

            <div class="messages" id="messages"></div>

            <div class="chat-input-area" id="chatInputArea">
                <input type="text" id="messageInput" placeholder="Ketik pesan..." autocomplete="off">
                <button id="sendBtn">KIRIM</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hlhlpznffrnuvxgcuwiu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__Xm9KHWul4yOcvbH9cPAGg_h_A4s0_O';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const OWNER_PHONE = '085290324268';

        let currentUser = null;
        let currentProfile = null;
        let currentChatUser = null;
        let messageSubscription = null;
        let allUsers = [];
        let isOwner = false;

        function badgeHTML(badge) {
            if (badge === 'red') return '<span class="badge badge-red" title="Owner">✓</span>';
            if (badge === 'blue') return '<span class="badge badge-blue" title="Terverifikasi">✓</span>';
            return '';
        }

        async function checkSession() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            currentUser = session.user;
            
            const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
            currentProfile = profile;
            isOwner = profile.badge === 'red';
            
            const myNameEl = document.getElementById('myName');
            myNameEl.innerHTML = (profile.full_name || profile.username || 'User') + badgeHTML(profile.badge);
            document.getElementById('myPhone').textContent = profile.phone_number || 'Membuat ID...';

            if (isOwner) {
                document.getElementById('ownerBtn').style.display = 'inline-block';
                document.getElementById('searchHint').textContent = 'Owner: semua user tampil di list';
            }
            
            const myAvatar = document.getElementById('myAvatar');
            if (profile.avatar_url) {
                myAvatar.style.backgroundImage = `url('${profile.avatar_url}')`;
                myAvatar.textContent = '';
            } else {
                myAvatar.textContent = (profile.full_name || 'U').charAt(0).toUpperCase();
            }

            await loadAllUsers();
        }

        async function loadAllUsers() {
            // Ambil semua user kecuali diri sendiri
            const { data: users } = await sb.from('profiles').select('*').neq('id', currentUser.id);
            allUsers = users || [];
            renderUserList();
        }

        // Fungsi: user yang boleh ditampilin default di list
        function getVisibleUsers() {
            if (isOwner) {
                // Owner liat semua
                return allUsers;
            }
            // User biasa cuma liat owner
            return allUsers.filter(u => u.phone_number === OWNER_PHONE);
        }

        function renderUserList() {
            const list = document.getElementById('userList');
            const visible = getVisibleUsers();

            let html = '';

            if (isOwner) {
                html += `<div class="list-label">Semua User (${visible.length})</div>`;
            } else {
                html += `<div class="list-label">Owner</div>`;
            }

            if (visible.length === 0) {
                html += '<div style="padding: 20px; text-align: center; color: var(--text-dim); font-size: 12px;">Owner belum tersedia.</div>';
                list.innerHTML = html;
                return;
            }

            html += visible.map(u => {
                const avatarStyle = u.avatar_url ? `background-image:url('${u.avatar_url}'); color: transparent;` : '';
                const avatarText = u.avatar_url ? '' : (u.full_name || 'U').charAt(0).toUpperCase();

                return `
                <div class="user-item" data-id="${u.id}" data-name="${u.full_name || u.username}" data-phone="${u.phone_number || '-'}" data-avatar="${u.avatar_url || ''}" data-badge="${u.badge || 'none'}">
                    <div class="avatar" style="${avatarStyle}">${avatarText}</div>
                    <div style="min-width:0;">
                        <div class="user-name">${u.full_name || u.username}${badgeHTML(u.badge)}</div>
                        <div class="user-phone">${u.phone_number || '-'}</div>
                    </div>
                </div>
                `;
            }).join('');

            list.innerHTML = html;

            document.querySelectorAll('.user-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.user-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    openChat(item.dataset.id, item.dataset.name, item.dataset.phone, item.dataset.avatar, item.dataset.badge);
                });
            });
        }

        // === SEARCH HANDLER ===
        const searchInput = document.getElementById('searchInput');
        const searchResultBox = document.getElementById('searchResult');

        searchInput.addEventListener('input', (e) => {
            const q = e.target.value.trim();
            searchResultBox.className = 'search-result';
            searchResultBox.innerHTML = '';

            if (!q) return;

            // Owner: search ke semua user (nama/nomor)
            // User biasa: search berdasarkan nomor lengkap
            let matched;

            if (isOwner) {
                matched = allUsers.filter(u =>
                    (u.full_name || '').toLowerCase().includes(q.toLowerCase()) ||
                    (u.username || '').toLowerCase().includes(q.toLowerCase()) ||
                    (u.phone_number || '').includes(q)
                );
            } else {
                // User biasa: wajib nomor lengkap (atau minimal 6 digit)
                if (q.length < 6) return;
                matched = allUsers.filter(u => (u.phone_number || '') === q);
            }

            // Kalo ada 1 exact match, tampilin
            if (matched.length === 0) {
                if (!isOwner && q.length >= 6) {
                    searchResultBox.innerHTML = `<div style="color:var(--text-dim); font-size:12px; padding:6px;">Nomor "${q}" tidak ditemukan</div>`;
                    searchResultBox.classList.add('show');
                }
                return;
            }

            // Tampilin 1 hasil (exact)
            const u = matched[0];
            const avatarStyle = u.avatar_url ? `background-image:url('${u.avatar_url}'); color: transparent;` : '';
            const avatarText = u.avatar_url ? '' : (u.full_name || 'U').charAt(0).toUpperCase();

            searchResultBox.innerHTML = `
                <div class="avatar" style="${avatarStyle}">${avatarText}</div>
                <div style="flex:1; min-width:0;">
                    <div class="user-name">${u.full_name || u.username}${badgeHTML(u.badge)}</div>
                    <div class="user-phone">${u.phone_number || '-'}</div>
                </div>
            `;
            searchResultBox.classList.add('show');

            searchResultBox.onclick = () => {
                openChat(u.id, u.full_name || u.username, u.phone_number, u.avatar_url, u.badge);
                searchResultBox.className = 'search-result';
                searchInput.value = '';
            };
        });

        async function openChat(userId, name, phone, avatarUrl, badge) {
            currentChatUser = { id: userId, name: name, phone: phone, avatar: avatarUrl };
            
            document.getElementById('emptyChat').style.display = 'none';
            document.getElementById('chatHeader').classList.add('active');
            document.getElementById('chatInputArea').classList.add('active');
            
            document.getElementById('chatName').innerHTML = name + badgeHTML(badge);
            document.getElementById('chatPhone').textContent = phone;
            
            const chatAvatar = document.getElementById('chatAvatar');
            if (avatarUrl) {
                chatAvatar.style.backgroundImage = `url('${avatarUrl}')`;
                chatAvatar.textContent = '';
            } else {
                chatAvatar.style.backgroundImage = 'none';
                chatAvatar.textContent = name.charAt(0).toUpperCase();
            }

            await loadMessages(userId);

            if (messageSubscription) messageSubscription.unsubscribe();
            
            messageSubscription = sb.channel('messages-realtime')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                    const msg = payload.new;
                    if ((msg.sender_id === currentUser.id && msg.receiver_id === userId) || 
                        (msg.sender_id === userId && msg.receiver_id === currentUser.id)) {
                        appendMessage(msg);
                    }
                })
                .subscribe();
        }

        async function loadMessages(otherUserId) {
            const { data: messages } = await sb.from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUser.id})`)
                .order('created_at', { ascending: true });

            const box = document.getElementById('messages');
            box.innerHTML = '';
            if (messages) messages.forEach(appendMessage);
        }

        function appendMessage(msg) {
            const box = document.getElementById('messages');
            const isMine = msg.sender_id === currentUser.id;
            
            const div = document.createElement('div');
            div.className = `message ${isMine ? 'mine' : 'theirs'}`;
            div.textContent = msg.content;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !currentChatUser) return;

            input.value = '';
            await sb.from('messages').insert({
                sender_id: currentUser.id,
                receiver_id: currentChatUser.id,
                content: content
            });
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await sb.auth.signOut();
            window.location.href = 'index.html';
        });

        checkSession();
    </script>
</body>
</html>
