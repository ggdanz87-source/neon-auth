<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Zerozx Neon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #050508;
            --card: rgba(10, 10, 15, 0.7);
            --border: rgba(0, 150, 255, 0.2);
            --text: #e0e0e0;
            --text-dim: #7a7a85;
            --neon: #00d4ff;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .bg-wrap { position: fixed; inset: 0; z-index: 0; }
        .neon-blob {
            position: absolute; border-radius: 50%; filter: blur(100px);
            opacity: 0.4; animation: floatBlob 15s infinite alternate;
        }
        .blob-a { width: 400px; height: 400px; background: #00d4ff; top: -100px; left: -100px; }
        .blob-b { width: 300px; height: 300px; background: #0055ff; bottom: -50px; right: -50px; animation-delay: -5s; }
        @keyframes floatBlob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(100px, 50px) scale(1.2); } }
        .grid-overlay {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(0, 212, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 212, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        }
        .dashboard-wrap { position: relative; z-index: 1; width: 100%; max-width: 600px; padding: 20px; }
        .card {
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.1);
            text-align: center;
            animation: cardIn 0.8s ease-out;
        }
        @keyframes cardIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: var(--neon);
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
            margin-bottom: 10px;
        }
        .subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 40px; }
        .user-info {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            text-align: left;
            margin-bottom: 30px;
        }
        .user-info p { margin: 10px 0; color: var(--text); }
        .user-info span { color: var(--neon); font-weight: bold; }
        .btn-logout {
            padding: 15px 40px;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-logout:hover {
            background: #ff4444;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
        }
    </style>
</head>
<body>
    <div class="bg-wrap">
        <div class="neon-blob blob-a"></div>
        <div class="neon-blob blob-b"></div>
        <div class="grid-overlay"></div>
    </div>

    <div class="dashboard-wrap">
        <div class="card">
            <h1>DASHBOARD</h1>
            <p class="subtitle">Selamat datang di Zerozx Neon System</p>
            
            <div class="user-info">
                <p>👤 Username: <span id="userName">Loading...</span></p>
                <p>📧 Email: <span id="userEmail">Loading...</span></p>
                <p>🆔 User ID: <span id="userId" style="font-size: 12px;">Loading...</span></p>
            </div>

            <button class="btn-logout" id="logoutBtn">LOGOUT</button>
        </div>
    </div>

    <!-- Load Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // GANTI PAKE URL & KEY SUPABASE LO (sama kaya di app.js)
        const SUPABASE_URL = 'https://hlhlpznffrnuvxgcuwiu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__Xm9KHWul4yOcvbH9cPAGg_h_A4s0_O';
        
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkSession() {
            const { data: { session }, error } = await sb.auth.getSession();
            
            if (error || !session) {
                window.location.href = 'index.html';
                return;
            }

            const user = session.user;
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userId').textContent = user.id;

            // Ambil profile dari tabel
            const { data: profile } = await sb.from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (profile) {
                document.getElementById('userName').textContent = profile.full_name || profile.username || 'User';
            } else {
                document.getElementById('userName').textContent = user.email.split('@')[0];
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await sb.auth.signOut();
            window.location.href = 'index.html';
        });

        // Jalankan
        checkSession();
    </script>
</body>
</html>
