<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — Zerozx Neon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #050508;
            --card: rgba(10, 10, 15, 0.8);
            --border: rgba(0, 150, 255, 0.2);
            --text: #e0e0e0;
            --text-dim: #7a7a85;
            --neon: #00d4ff;
            --neon-dark: #0088cc;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        /* --- BACKGROUND NEON --- */
        .bg-wrap { position: fixed; inset: 0; z-index: 0; }
        .neon-blob { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.4; animation: floatBlob 15s infinite alternate; }
        .blob-a { width: 400px; height: 400px; background: #00d4ff; top: -100px; left: -100px; }
        .blob-b { width: 300px; height: 300px; background: #0055ff; bottom: -50px; right: -50px; }
        @keyframes floatBlob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(100px, 50px) scale(1.2); } }
        
        /* --- LAYOUT CHAT --- */
        .chat-layout {
            position: relative; z-index: 1; display: flex; width: 100%; max-width: 1200px; height: 90vh; margin: auto;
            background: var(--card); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 20px; overflow: hidden;
        }

        /* --- SIDEBAR (List User) --- */
        .sidebar {
            width: 320px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: rgba(0,0,0,0.3);
        }
        .sidebar-header {
            padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--neon-dark), var(--neon));
            display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000;
        }
        .my-id { font-size: 12px; color: var(--neon); font-weight: bold; }
        .search-box { padding: 15px; }
        .search-box input {
            width: 100%; padding: 10px 15px; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            border-radius: 8px; color: #fff; font-family: inherit; outline: none;
        }
        .search-box input:focus { border-color: var(--neon); }
        .user-list { flex: 1; overflow-y: auto; }
        .user-item {
            padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 12px;
        }
        .user-item:hover, .user-item.active { background: rgba(0, 212, 255, 0.1); border-left: 3px solid var(--neon); }
        .user-name { font-weight: 600; color: #fff; }
        .user-phone { font-size: 11px; color: var(--text-dim); }

        /* --- CHAT AREA --- */
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .empty-chat { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-dim); }
        
        .chat-header {
            padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; display: none;
        }
        .chat-header.active { display: flex; }
        .chat-header .user-name { font-size: 16px; }
        
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message {
            max-width: 70%; padding: 12px 16px; border-radius: 15px; font-size: 14px; line-height: 1.4;
        }
        .message.mine {
            align-self: flex-end; background: linear-gradient(135deg, var(--neon-dark), var(--neon)); color: #000;
            border-bottom-right-radius: 2px; font-weight: 500;
        }
        .message.theirs {
            align-self: flex-start; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff;
            border-bottom-left-radius: 2px;
        }
        
        .chat-input-area {
            padding: 15px; border-top: 1px solid var(--border); display: none; gap: 10px;
        }
        .chat-input-area.active { display: flex; }
        .chat-input-area input {
            flex: 1; padding: 12px 15px; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            border-radius: 10px; color: #fff; font-family: inherit; outline: none;
        }
        .chat-input-area button {
            padding: 0 25px; background: var(--neon); border: none; border-radius: 10px; font-weight: bold; cursor: pointer;
            color: #000; transition: 0.2s;
        }
        .chat-input-area button:hover { box-shadow: 0 0 15px var(--neon); }
        
        .logout-btn {
            background: transparent; border: 1px solid #ff4444; color: #ff4444; padding: 5px 15px;
            border-radius: 5px; cursor: pointer; font-size: 12px; transition: 0.2s;
        }
        .logout-btn:hover { background: #ff4444; color: #000; }
    </style>
</head>
<body>
    <div class="bg-wrap">
        <div class="neon-blob blob-a"></div>
        <div class="neon-blob blob-b"></div>
    </div>

    <div class="chat-layout">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <div class="avatar" id="myAvatar">?</div>
                    <div>
                        <div class="user-name" id="myName">Loading...</div>
                        <div class="my-id" id="myPhone">-</div>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari nomor atau nama...">
            </div>
            <div class="user-list" id="userList">
                <div style="padding: 20px; text-align: center; color: var(--text-dim); font-size: 12px;">Mencari user...</div>
            </div>
        </div>

        <!-- CHAT AREA -->
        <div class="chat-area">
            <div class="empty-chat" id="emptyChat">
                <div style="font-size: 50px; margin-bottom: 10px;">💬</div>
                <p>Pilih user untuk mulai chat</p>
            </div>

            <div class="chat-header" id="chatHeader">
                <div class="avatar" id="chatAvatar">?</div>
                <div>
                    <div class="user-name" id="chatName">-</div>
                    <div style="font-size: 11px; color: var(--neon);" id="chatPhone">-</div>
                </div>
            </div>

            <div class="messages" id="messages"></div>

            <div class="chat-input-area" id="chatInputArea">
                <input type="text" id="messageInput" placeholder="Ketik pesan..." autocomplete="off">
                <button id="sendBtn">KIRIM</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // GANTI URL & KEY SUPABASE LO!
        const SUPABASE_URL = 'https://hlhlpznffrnuvxgcuwiu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__Xm9KHWul4yOcvbH9cPAGg_h_A4s0_O';
        
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentProfile = null;
        let currentChatUser = null;
        let messageSubscription = null;
        let allUsers = [];

        // 1. Cek Session
        async function checkSession() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            currentUser = session.user;
            
            // Ambil profile gw sendiri
            const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
            currentProfile = profile;
            
            document.getElementById('myName').textContent = profile.full_name || profile.username;
            document.getElementById('myPhone').textContent = profile.phone_number || 'Membuat ID...';
            document.getElementById('myAvatar').textContent = (profile.full_name || 'U').charAt(0).toUpperCase();

            // Load semua user lain
            loadAllUsers();
        }

        // 2. Load User List
        async function loadAllUsers() {
            const { data: users } = await sb.from('profiles').select('*').neq('id', currentUser.id);
            allUsers = users || [];
            renderUserList(allUsers);
        }

        function renderUserList(users) {
            const list = document.getElementById('userList');
            if (users.length === 0) {
                list.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-dim); font-size: 12px;">Belum ada user lain.</div>';
                return;
            }

            list.innerHTML = users.map(u => `
                <div class="user-item" data-id="${u.id}" data-name="${u.full_name || u.username}" data-phone="${u.phone_number || '-'}">
                    <div class="avatar">${(u.full_name || 'U').charAt(0).toUpperCase()}</div>
                    <div>
                        <div class="user-name">${u.full_name || u.username}</div>
                        <div class="user-phone">${u.phone_number || '-'}</div>
                    </div>
                </div>
            `).join('');

            // Event Klik User
            document.querySelectorAll('.user-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.user-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    openChat(item.dataset.id, item.dataset.name, item.dataset.phone);
                });
            });
        }

        // 3. Search User
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allUsers.filter(u => 
                (u.full_name || '').toLowerCase().includes(q) || 
                (u.username || '').toLowerCase().includes(q) ||
                (u.phone_number || '').includes(q)
            );
            renderUserList(filtered);
        });

        // 4. Open Chat Room
        async function openChat(userId, name, phone) {
            currentChatUser = { id: userId, name: name, phone: phone };
            
            document.getElementById('emptyChat').style.display = 'none';
            document.getElementById('chatHeader').classList.add('active');
            document.getElementById('chatInputArea').classList.add('active');
            
            document.getElementById('chatName').textContent = name;
            document.getElementById('chatPhone').textContent = phone;
            document.getElementById('chatAvatar').textContent = name.charAt(0).toUpperCase();

            // Load pesan lama
            await loadMessages(userId);

            // Subscribe ke pesan baru (Realtime)
            if (messageSubscription) messageSubscription.unsubscribe();
            
            messageSubscription = sb.channel('messages-realtime')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                    const msg = payload.new;
                    // Kalo pesan dari user yang lagi dibuka ATAU dari gw sendiri
                    if ((msg.sender_id === currentUser.id && msg.receiver_id === userId) || 
                        (msg.sender_id === userId && msg.receiver_id === currentUser.id)) {
                        appendMessage(msg);
                    }
                })
                .subscribe();
        }

        // 5. Load Pesan
        async function loadMessages(otherUserId) {
            const { data: messages } = await sb.from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},receiver_id.eq.${currentUser.id})`)
                .order('created_at', { ascending: true });

            const box = document.getElementById('messages');
            box.innerHTML = '';
            if (messages) messages.forEach(appendMessage);
        }

        function appendMessage(msg) {
            const box = document.getElementById('messages');
            const isMine = msg.sender_id === currentUser.id;
            
            const div = document.createElement('div');
            div.className = `message ${isMine ? 'mine' : 'theirs'}`;
            div.textContent = msg.content;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // 6. Kirim Pesan
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !currentChatUser) return;

            input.value = '';
            await sb.from('messages').insert({
                sender_id: currentUser.id,
                receiver_id: currentChatUser.id,
                content: content
            });
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 7. Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await sb.auth.signOut();
            window.location.href = 'index.html';
        });

        // JALANKAN
        checkSession();
    </script>
</body>
</html>
