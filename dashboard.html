<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon — Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #08090c; --surface: #0f1116; --surface-2: #14171e;
            --line: #1e232d; --line-hi: #2a3140;
            --text: #e8ecf2; --text-dim: #7b8493; --text-mute: #4d5563;
            --accent: #4cc9f0; --accent-dim: #1d6d85;
            --red: #ff4757; --blue: #3a86ff; --success: #2ec4b6;
        }
        body {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased;
            user-select: none;
        }
        .bg {
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(76, 201, 240, 0.12), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(58, 134, 255, 0.06), transparent);
            pointer-events: none;
        }
        .bg::before {
            content: ''; position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(76, 201, 240, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(76, 201, 240, 0.025) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }
        .shell {
            position: relative; z-index: 1; display: flex;
            width: 100%; max-width: 1180px; height: 92vh;
            margin: 4vh auto; background: var(--surface);
            border: 1px solid var(--line); border-radius: 14px;
            overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .sidebar {
            width: 340px; display: flex; flex-direction: column;
            background: var(--bg); border-right: 1px solid var(--line); flex-shrink: 0;
        }
        .me { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
        .me-info { flex: 1; min-width: 0; }
        .me-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .me-phone { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); margin-top: 2px; }
        .me-actions { display: flex; gap: 6px; }
        .icon-btn {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            background: transparent; border: 1px solid var(--line); border-radius: 7px;
            color: var(--text-dim); cursor: pointer; transition: all 0.15s; text-decoration: none;
        }
        .icon-btn:hover { border-color: var(--line-hi); color: var(--text); background: var(--surface-2); }
        .icon-btn svg { width: 15px; height: 15px; }
        .icon-btn.danger:hover { border-color: var(--red); color: var(--red); }
        .icon-btn.owner-active { border-color: var(--red); color: var(--red); }
        .search { padding: 14px 20px; border-bottom: 1px solid var(--line); }
        .search-input-wrap { position: relative; }
        .search-input-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-mute); pointer-events: none; }
        .search input {
            width: 100%; padding: 9px 12px 9px 32px; background: var(--bg);
            border: 1px solid var(--line); border-radius: 7px; color: var(--text);
            font-family: inherit; font-size: 13px; outline: none; transition: border-color 0.15s;
        }
        .search input::placeholder { color: var(--text-mute); }
        .search input:focus { border-color: var(--accent-dim); }
        .search-hint { font-size: 10.5px; color: var(--text-mute); margin-top: 8px; line-height: 1.4; }
        .search-result {
            display: none; margin: 0 20px 12px; padding: 10px 12px;
            background: var(--surface-2); border: 1px solid var(--accent-dim);
            border-radius: 8px; cursor: pointer; align-items: center; gap: 10px; transition: background 0.15s;
        }
        .search-result.show { display: flex; }
        .search-result:hover { background: #1a1f28; }
        .search-result .empty-msg { font-size: 12px; color: var(--text-dim); }
        .list-scroll { flex: 1; overflow-y: auto; padding: 4px 0; }
        .list-scroll::-webkit-scrollbar { width: 4px; }
        .list-scroll::-webkit-scrollbar-thumb { background: var(--line-hi); border-radius: 2px; }
        .list-label {
            padding: 12px 20px 6px; font-size: 10px; text-transform: uppercase;
            letter-spacing: 1.2px; color: var(--text-mute); font-weight: 600;
        }
        .user-item {
            padding: 11px 20px; display: flex; align-items: center; gap: 11px;
            cursor: pointer; border-left: 2px solid transparent; transition: background 0.12s, border-color 0.12s;
        }
        .user-item:hover { background: var(--surface-2); }
        .user-item.active { background: var(--surface-2); border-left-color: var(--accent); }
        .user-meta { min-width: 0; flex: 1; }
        .user-name {
            font-weight: 500; font-size: 13.5px; color: var(--text);
            display: flex; align-items: center; gap: 5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-phone { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-dim); margin-top: 2px; }
        .avatar {
            width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2);
            border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 14px; color: var(--accent);
            flex-shrink: 0; overflow: hidden; background-size: cover; background-position: center;
        }
        .avatar.lg { width: 44px; height: 44px; border-radius: 11px; font-size: 15px; }
        .badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 15px; height: 15px; border-radius: 50%; flex-shrink: 0;
        }
        .badge svg { width: 9px; height: 9px; color: #fff; }
        .badge.red { background: var(--red); }
        .badge.blue { background: var(--blue); }
        .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .empty {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 14px; color: var(--text-mute);
        }
        .empty svg { width: 44px; height: 44px; color: var(--line-hi); }
        .empty p { font-size: 13.5px; }
        .chat-head {
            padding: 14px 22px; border-bottom: 1px solid var(--line);
            display: none; align-items: center; gap: 12px; background: var(--surface);
        }
        .chat-head.show { display: flex; }
        .chat-head-info { min-width: 0; }
        .chat-head-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .chat-head-phone { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); margin-top: 2px; }
        
        .messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 6px; }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: var(--line-hi); border-radius: 3px; }
        
        .msg {
            max-width: 70%; padding: 10px 14px; font-size: 13.5px;
            line-height: 1.5; border-radius: 14px; word-wrap: break-word; white-space: pre-wrap;
            cursor: pointer; transition: opacity 0.2s;
        }
        .msg:active { opacity: 0.7; }
        .msg.mine { align-self: flex-end; background: var(--accent); color: #04121a; font-weight: 500; border-bottom-right-radius: 4px; }
        .msg.theirs { align-self: flex-start; background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
        .msg.deleted { font-style: italic; color: var(--text-mute); background: transparent !important; border: 1px dashed var(--line-hi) !important; }

        .composer {
            padding: 14px 18px; border-top: 1px solid var(--line);
            display: none; gap: 10px; background: var(--surface);
        }
        .composer.show { display: flex; }
        .composer input {
            flex: 1; padding: 11px 15px; background: var(--bg);
            border: 1px solid var(--line); border-radius: 9px; color: var(--text);
            font-family: inherit; font-size: 13.5px; outline: none; transition: border-color 0.15s;
        }
        .composer input:focus { border-color: var(--accent-dim); }
        .composer input::placeholder { color: var(--text-mute); }
        .send-btn {
            padding: 0 20px; background: var(--accent); border: none; border-radius: 9px;
            color: #04121a; font-family: inherit; font-weight: 600; font-size: 13px;
            cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px;
        }
        .send-btn svg { width: 14px; height: 14px; }
        .send-btn:hover { background: #6ad5f5; }
        .send-btn:active { transform: scale(0.97); }

        .ctx-menu {
            position: fixed; z-index: 99999; background: var(--surface);
            border: 1px solid var(--line-hi); border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); padding: 6px;
            display: none; min-width: 180px; animation: popIn 0.1s ease-out;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .ctx-menu.show { display: block; }
        .ctx-item {
            padding: 9px 12px; border-radius: 5px; cursor: pointer; font-size: 13px;
            color: var(--text); display: flex; align-items: center; gap: 8px; transition: background 0.15s;
        }
        .ctx-item:hover { background: var(--surface-2); }
        .ctx-item.danger { color: var(--red); }
        .ctx-item.danger:hover { background: rgba(255, 71, 87, 0.1); }
        .ctx-item svg { width: 14px; height: 14px; }

        .modal-overlay {
            position: fixed; inset: 0; z-index: 100000;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; animation: fadeIn 0.15s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-box {
            background: var(--surface); border: 1px solid var(--line-hi);
            border-radius: 12px; padding: 24px; max-width: 340px; width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9); animation: slideUp 0.2s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-title { font-weight: 600; font-size: 16px; margin-bottom: 8px; color: var(--text); }
        .modal-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-cancel {
            padding: 9px 16px; background: transparent; border: 1px solid var(--line-hi);
            border-radius: 7px; color: var(--text); font-family: inherit; font-weight: 500;
            font-size: 13px; cursor: pointer; transition: all 0.15s;
        }
        .btn-cancel:hover { background: var(--surface-2); }
        .btn-confirm-del {
            padding: 9px 16px; background: var(--red); border: none;
            border-radius: 7px; color: #fff; font-family: inherit; font-weight: 600;
            font-size: 13px; cursor: pointer; transition: all 0.15s;
        }
        .btn-confirm-del:hover { background: #ff6b77; }
    </style>
</head>
<body>
    <div class="bg"></div>

    <div class="shell">
        <aside class="sidebar">

                <div class="avatar" id="myAvatar"></div>

            <div class="search">

                    <input type="text" id="searchInput" placeholder="Cari nomor atau nama">

            <div class="messages" id="messages"></div>

            <div class="composer" id="composer">
                <input type="text" id="messageInput" placeholder="Tulis pesan..." autocomplete="off">

    </div>

    <!-- KONTEXT MENU -->
    <div class="ctx-menu" id="ctxMenu">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>

            Hapus untuk saya
        </div>
    </div>

    <!-- MODAL KONFIRMASI TENGAH LAYAR -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Hapus Pesan?</div>
            <div class="modal-desc" id="modalDesc">Pesan ini akan dihapus.</div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">Batal</button>
                <button class="btn-confirm-del" id="modalConfirm">Hapus</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hlhlpznffrnuvxgcuwiu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__Xm9KHWul4yOcvbH9cPAGg_h_A4s0_O';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const OWNER_PHONE = '085290324268';

        const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

        const TOXIC_WORDS = [
            'anjing', 'anjg', 'anjir', 'anjay', 'asw', 'asu', 'bangsat', 'bgst',
            'bajingan', 'brengsek', 'setan', 'iblis', 'keparat', 'bedebah',
            'kontol', 'kntl', 'memek', 'mmk', 'pepek', 'puki', 'pukimak',
            'ngentot', 'ngentd', 'ngehe', 'jancok', 'jancuk', 'cok', 'cuk',
            'goblok', 'goblog', 'tolol', 'idiot', 'bego', 'bodoh', 'dungu',
            'sinting', 'gila', 'edan', 'sarap', 'yatim', 'piatu', 'bocah', 
            'miskin', 'mati', 'matilo', 'bunuh', 'bunuhdiri', 'cabul', 
            'perkosa', 'r***', 'r4p3', 'kampret', 'kmpret', 'bejat', 'biadab', 
            'laknat', 'terkutuk', 'sialan', 'sial', 'tai', 'taik', 'kotoran',
            'fuck', 'fck', 'shit', 'bitch', 'bastard', 'dick', 'pussy',
            'asshole', 'cunt', 'whore', 'slut', 'retard'
        ];
        const HIGH_SEVERITY_WORDS = [
            'bunuh', 'matilo', 'bunuhdiri', 'perkosa', 'r4p3', 'cabul',
            'yatim', 'piatu', 'kampret', 'laknat', 'terkutuk', 'biadab'
        ];

        function normalizeText(text) {
            return text.toLowerCase()
                .replace(/[0@]/g, 'o').replace(/[1!|]/g, 'i').replace(/3/g, 'e')
                .replace(/4/g, 'a').replace(/5/g, 's').replace(/7/g, 't')
                .replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function detectToxic(text) {
            const norm = normalizeText(text);
            const words = norm.split(' ');
            const matched = [];
            TOXIC_WORDS.forEach(w => {
                if (words.includes(w) || norm.includes(w)) {
                    if (!matched.includes(w)) matched.push(w);
                }
            });
            if (matched.length === 0) return { matched: [], severity: null };
            const isHigh = matched.some(w => HIGH_SEVERITY_WORDS.includes(w));
            return { matched, severity: isHigh ? 'high' : 'low' };
        }

        let currentUser = null;
        let currentProfile = null;
        let currentChatUser = null;
        let messageSubscription = null;
        let allUsers = [];
        let isOwner = false;
        let activeMessage = null;
        let activeAction = null;

        function badgeHTML(badge) {
            if (badge === 'red')  return `<span class="badge red" title="Owner">${CHECK_SVG}</span>`;
            if (badge === 'blue') return `<span class="badge blue" title="Terverifikasi">${CHECK_SVG}</span>`;
            return '';
        }

        function avatarHTML(user, large = false) {
            const cls = large ? 'avatar lg' : 'avatar';
            if (user.avatar_url) return `<div class="${cls}" style="background-image:url('${user.avatar_url}'); color:transparent;"></div>`;
            const initial = (user.full_name || user.username || 'U').charAt(0).toUpperCase();
            return `<div class="${cls}">${initial}</div>`;
        }

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;

            const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
            currentProfile = profile;
            isOwner = profile.badge === 'red';

            document.getElementById('myName').innerHTML = (profile.full_name || profile.username || 'User') + badgeHTML(profile.badge);
            document.getElementById('myPhone').textContent = profile.phone_number || '—';

            const myAvatar = document.getElementById('myAvatar');
            if (profile.avatar_url) myAvatar.style.backgroundImage = `url('${profile.avatar_url}')`;
            else myAvatar.textContent = (profile.full_name || 'U').charAt(0).toUpperCase();

            if (isOwner) {
                document.getElementById('ownerBtn').style.display = 'inline-flex';
                document.getElementById('searchHint').textContent = 'Mode owner: semua pengguna tampil di daftar';
            }

            await loadUsers();
        }

        async function loadUsers() {
            const { data } = await sb.from('profiles').select('*').neq('id', currentUser.id);
            allUsers = data || [];
            renderList();
        }

        function getVisible() {
            if (isOwner) return allUsers;
            return allUsers.filter(u => u.phone_number === OWNER_PHONE);
        }

        function renderList() {
            const list = document.getElementById('userList');
            const visible = getVisible();
            let html = `<div class="list-label">${isOwner ? 'Semua pengguna · ' + visible.length : 'Owner'}</div>`;

            if (visible.length === 0) {
                html += `<div style="padding: 24px 20px; text-align: center; color: var(--text-mute); font-size: 12px; line-height: 1.5;">
                    Belum ada kontak tersedia.<br>Gunakan pencarian untuk menemukan pengguna lain.
                </div>`;
                list.innerHTML = html;
                return;
            }

            html += visible.map(u => `
                <div class="user-item" data-id="${u.id}" data-name="${escapeAttr(u.full_name || u.username || 'User')}" data-phone="${u.phone_number || '-'}" data-avatar="${u.avatar_url || ''}" data-badge="${u.badge || 'none'}">
                    ${avatarHTML(u)}
                    <div class="user-meta">
                        <div class="user-name">${u.full_name || u.username}${badgeHTML(u.badge)}</div>
                        <div class="user-phone">${u.phone_number || '—'}</div>
                    </div>
                </div>
            `).join('');

            list.innerHTML = html;
            list.querySelectorAll('.user-item').forEach(el => {
                el.addEventListener('click', () => {
                    list.querySelectorAll('.user-item').forEach(i => i.classList.remove('active'));
                    el.classList.add('active');
                    openChat(el.dataset.id, el.dataset.name, el.dataset.phone, el.dataset.avatar, el.dataset.badge);
                });
            });
        }

        function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

        const searchInput = document.getElementById('searchInput');
        const searchResult = document.getElementById('searchResult');

        searchInput.addEventListener('input', (e) => {
            const q = e.target.value.trim();
            searchResult.className = 'search-result';
            searchResult.innerHTML = '';
            searchResult.onclick = null;
            if (!q) return;

            let matched;
            if (isOwner) {
                matched = allUsers.filter(u =>
                    (u.full_name || '').toLowerCase().includes(q.toLowerCase()) ||
                    (u.username || '').toLowerCase().includes(q.toLowerCase()) ||
                    (u.phone_number || '').includes(q)
                );
            } else {
                if (q.length < 6) return;
                matched = allUsers.filter(u => (u.phone_number || '') === q);
            }

            if (matched.length === 0) {
                if (!isOwner && q.length >= 6) {
                    searchResult.innerHTML = `<div class="empty-msg">Nomor "${q}" tidak ditemukan</div>`;
                    searchResult.classList.add('show');
                }
                return;
            }

            const u = matched[0];
            searchResult.innerHTML = `
                ${avatarHTML(u, true)}
                <div class="user-meta">
                    <div class="user-name">${u.full_name || u.username}${badgeHTML(u.badge)}</div>
                    <div class="user-phone">${u.phone_number || '—'}</div>
                </div>
            `;
            searchResult.classList.add('show');
            searchResult.onclick = () => {
                openChat(u.id, u.full_name || u.username, u.phone_number, u.avatar_url, u.badge);
                searchResult.className = 'search-result';
                searchInput.value = '';
            };
        });

        async function openChat(id, name, phone, avatar, badge) {
            currentChatUser = { id, name, phone, avatar };
            document.getElementById('emptyChat').style.display = 'none';
            document.getElementById('chatHeader').classList.add('show');
            document.getElementById('composer').classList.add('show');
            document.getElementById('chatName').innerHTML = name + badgeHTML(badge);
            document.getElementById('chatPhone').textContent = phone || '—';

            const ca = document.getElementById('chatAvatar');
            if (avatar) {
                ca.style.backgroundImage = `url('${avatar}')`;
                ca.textContent = '';
            } else {
                ca.style.backgroundImage = 'none';
                ca.textContent = name.charAt(0).toUpperCase();
            }

            await loadMessages(id);

            if (messageSubscription) messageSubscription.unsubscribe();
            messageSubscription = sb.channel('messages-realtime')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                    const m = payload.new;
                    if ((m.sender_id === currentUser.id && m.receiver_id === id) ||
                        (m.sender_id === id && m.receiver_id === currentUser.id)) {
                        
                        // Filter logic kalo di-refresh
                        if (m.sender_id === currentUser.id && m.deleted_by_sender) return;
                        if (m.sender_id === id && m.deleted_by_receiver) return;
                        
                        appendMessage(m);
                    }
                })
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, (payload) => {
                    const m = payload.new;
                    const el = document.querySelector(`.msg[data-id="${m.id}"]`);
                    
                    // Kalo ada update (dihapus untuk semua), ubah jadi teks "[Pesan telah dihapus]"
                    if (m.content === '[Pesan telah dihapus]' && el) {
                        el.className = `msg ${m.sender_id === currentUser.id ? 'mine' : 'theirs'} deleted`;
                        el.textContent = '[Pesan telah dihapus]';
                    }
                })
                .subscribe();
        }

        async function loadMessages(otherId) {
            const { data } = await sb.from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${currentUser.id})`)
                .order('created_at', { ascending: true });
            
            const box = document.getElementById('messages');
            box.innerHTML = '';
            
            if (data) {
                data.forEach(m => {
                    // Filter hapus untuk saya
                    if (m.sender_id === currentUser.id && m.deleted_by_sender) return;
                    if (m.sender_id === otherId && m.deleted_by_receiver) return;

                    appendMessage(m);
                });
            }
        }

        function appendMessage(m) {
            if (document.querySelector(`.msg[data-id="${m.id}"]`)) return;

            const box = document.getElementById('messages');
            const mine = m.sender_id === currentUser.id;
            const div = document.createElement('div');
            div.className = `msg ${mine ? 'mine' : 'theirs'}`;
            
            // Kalo pesannya udah dihapus (misal baru refresh), tampilin teks hapus
            if (m.content === '[Pesan telah dihapus]') {
                div.classList.add('deleted');
                div.textContent = '[Pesan telah dihapus]';
            } else {
                div.textContent = m.content;
            }

            div.dataset.id = m.id;

            // Event Listener
            div.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                showContextMenu(e.clientX, e.clientY, m);
            });

            let pressTimer;
            div.addEventListener('touchstart', (e) => {
                pressTimer = setTimeout(() => {
                    const touch = e.touches[0];
                    showContextMenu(touch.clientX, touch.clientY, m);
                    if (navigator.vibrate) navigator.vibrate(50);
                }, 400); 
            });
            div.addEventListener('touchend', () => clearTimeout(pressTimer));
            div.addEventListener('touchmove', () => clearTimeout(pressTimer));

            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        const ctxMenu = document.getElementById('ctxMenu');
        
        function showContextMenu(x, y, msgData) {
            activeMessage = msgData;
            const isMine = msgData.sender_id === currentUser.id;

            const elAll = document.getElementById('ctxDeleteAll');
            elAll.style.display = isMine ? 'flex' : 'none';
            
            const menuW = 180, menuH = isMine ? 90 : 50;
            if (x + menuW > window.innerWidth) x -= menuW;
            if (y + menuH > window.innerHeight) y -= menuH;

            ctxMenu.style.left = x + 'px';
            ctxMenu.style.top = y + 'px';
            ctxMenu.classList.add('show');
        }

        document.addEventListener('click', (e) => {
            if (!ctxMenu.contains(e.target)) ctxMenu.classList.remove('show');
        });

        document.addEventListener('contextmenu', (e) => {
            if (!e.target.closest('.msg')) e.preventDefault(); 
        });

        const confirmModal = document.getElementById('confirmModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');

        function openModal(title, desc, action) {
            modalTitle.textContent = title;
            modalDesc.textContent = desc;
            activeAction = action;
            confirmModal.classList.add('show');
        }

        document.getElementById('modalCancel').addEventListener('click', () => {
            confirmModal.classList.remove('show');
            activeAction = null;
        });

        document.getElementById('ctxDeleteAll').addEventListener('click', () => {
            ctxMenu.classList.remove('show');
            openModal('Hapus untuk semua?', 'Pesan ini akan hilang dari layar kamu dan lawan bicara.', 'delete_all');
        });

        document.getElementById('ctxDeleteMe').addEventListener('click', () => {
            ctxMenu.classList.remove('show');
            openModal('Hapus pesan?', 'Pesan ini hanya akan hilang dari layar kamu sendiri.', 'delete_me');
        });

        document.getElementById('modalConfirm').addEventListener('click', async () => {
            if (!activeMessage || !activeAction) return;
            confirmModal.classList.remove('show');

            const m = activeMessage;
            const isMine = m.sender_id === currentUser.id;
            const el = document.querySelector(`.msg[data-id="${m.id}"]`);

            if (activeAction === 'delete_all') {
                if (!isMine) return;
                // GANTI TEKS JADI [Pesan telah dihapus] (Gak bener-bener hapus dari DB biar lawan bisa liat dihapus)
                await sb.from('messages').update({ content: '[Pesan telah dihapus]' }).eq('id', m.id);
                
                if (el) {
                    el.className = `msg ${isMine ? 'mine' : 'theirs'} deleted`;
                    el.textContent = '[Pesan telah dihapus]';
                }
            } 
            else if (activeAction === 'delete_me') {
                // GANTI TEKS JADI KOSONG DI DATABASE BIAR PAS REFRESH HILANG
                const updateData = isMine ? { deleted_by_sender: true } : { deleted_by_receiver: true };
                // Hapus permanen datanya dari DB biar refresh gak muncul
                await sb.from('messages').delete().eq('id', m.id); 
                
                if (el) el.remove();
            }

            activeMessage = null;
            activeAction = null;
        });

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !currentChatUser) return;
            
            input.value = '';
            const { matched, severity } = detectToxic(content);
            
            if (matched.length > 0) {
                const { error: logErr } = await sb.from('moderation_logs').insert({
                    sender_id: currentUser.id,
                    receiver_id: currentChatUser.id,
                    content: content,
                    matched_words: matched,
                    severity: severity
                });
                if (logErr) console.error('GAGAL SIMPAN LOG:', logErr);
                if (severity === 'high') showToxicWarning();
            }

            const { error: insErr } = await sb.from('messages').insert({
                sender_id: currentUser.id,
                receiver_id: currentChatUser.id,
                content
            });

            if (insErr) console.error('Gagal kirim pesan:', insErr);
        }

        function showToxicWarning() {
            const existing = document.getElementById('toxicWarn');
            if (existing) existing.remove();
            const warn = document.createElement('div');
            warn.id = 'toxicWarn';
            warn.textContent = 'Pesanmu terdeteksi mengandung kata tidak pantas. Pesan ini dicatat.';
            warn.style.cssText = `
                position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
                background: #1f1116; border: 1px solid #ff4757; color: #ff8a94;
                padding: 10px 16px; border-radius: 8px; font-size: 12px;
                font-family: 'Space Grotesk', sans-serif; z-index: 9999;
                box-shadow: 0 8px 24px rgba(255,71,87,0.25);
                max-width: 90%; text-align: center; pointer-events: none;
            `;
            document.body.appendChild(warn);
            setTimeout(() => warn.remove(), 4000);
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await sb.auth.signOut();
            window.location.href = 'index.html';
        });

        init();
    </script>
</body>
</html>
