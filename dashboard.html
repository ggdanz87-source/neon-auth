<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon — Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:        #08090c;
            --surface:   #0f1116;
            --surface-2: #14171e;
            --line:      #1e232d;
            --line-hi:   #2a3140;
            --text:      #e8ecf2;
            --text-dim:  #7b8493;
            --text-mute: #4d5563;
            --accent:    #4cc9f0;
            --accent-dim:#1d6d85;
            --red:       #ff4757;
            --blue:      #3a86ff;
            --success:   #2ec4b6;
        }

        body {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ============ BACKGROUND ============ */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(76, 201, 240, 0.12), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(58, 134, 255, 0.06), transparent);
            pointer-events: none;
        }
        .bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(76, 201, 240, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(76, 201, 240, 0.025) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }

        /* ============ LAYOUT ============ */
        .shell {
            position: relative;
            z-index: 1;
            display: flex;
            width: 100%;
            max-width: 1180px;
            height: 92vh;
            margin: 4vh auto;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* ============ SIDEBAR ============ */
        .sidebar {
            width: 340px;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            border-right: 1px solid var(--line);
            flex-shrink: 0;
        }

        .me {
            padding: 18px 20px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .me-info { flex: 1; min-width: 0; }
        .me-name {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .me-phone {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            margin-top: 2px;
        }
        .me-actions { display: flex; gap: 6px; }

        .icon-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 7px;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
        }
        .icon-btn:hover {
            border-color: var(--line-hi);
            color: var(--text);
            background: var(--surface-2);
        }
        .icon-btn svg { width: 15px; height: 15px; }
        .icon-btn.danger:hover {
            border-color: var(--red);
            color: var(--red);
        }
        .icon-btn.owner-active {
            border-color: var(--red);
            color: var(--red);
        }

        /* Search */
        .search {
            padding: 14px 20px;
            border-bottom: 1px solid var(--line);
        }
        .search-input-wrap {
            position: relative;
        }
        .search-input-wrap svg {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: var(--text-mute);
            pointer-events: none;
        }
        .search input {
            width: 100%;
            padding: 9px 12px 9px 32px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 7px;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s;
        }
        .search input::placeholder { color: var(--text-mute); }
        .search input:focus { border-color: var(--accent-dim); }
        .search-hint {
            font-size: 10.5px;
            color: var(--text-mute);
            margin-top: 8px;
            line-height: 1.4;
        }

        /* Search result */
        .search-result {
            display: none;
            margin: 0 20px 12px;
            padding: 10px 12px;
            background: var(--surface-2);
            border: 1px solid var(--accent-dim);
            border-radius: 8px;
            cursor: pointer;
            align-items: center;
            gap: 10px;
            transition: background 0.15s;
        }
        .search-result.show { display: flex; }
        .search-result:hover { background: #1a1f28; }
        .search-result .empty-msg {
            font-size: 12px;
            color: var(--text-dim);
        }

        /* User list */
        .list-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        .list-scroll::-webkit-scrollbar { width: 4px; }
        .list-scroll::-webkit-scrollbar-thumb { background: var(--line-hi); border-radius: 2px; }
        .list-scroll::-webkit-scrollbar-track { background: transparent; }

        .list-label {
            padding: 12px 20px 6px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-mute);
            font-weight: 600;
        }

        .user-item {
            padding: 11px 20px;
            display: flex;
            align-items: center;
            gap: 11px;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: background 0.12s, border-color 0.12s;
        }
        .user-item:hover { background: var(--surface-2); }
        .user-item.active {
            background: var(--surface-2);
            border-left-color: var(--accent);
        }
        .user-meta { min-width: 0; flex: 1; }
        .user-name {
            font-weight: 500;
            font-size: 13.5px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-phone {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        /* Avatar */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--accent);
            flex-shrink: 0;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        .avatar.lg { width: 44px; height: 44px; border-radius: 11px; font-size: 15px; }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .badge svg { width: 9px; height: 9px; color: #fff; }
        .badge.red { background: var(--red); }
        .badge.blue { background: var(--blue); }

        /* ============ CHAT AREA ============ */
        .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        .empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: var(--text-mute);
        }
        .empty svg { width: 44px; height: 44px; color: var(--line-hi); }
        .empty p { font-size: 13.5px; }

        .chat-head {
            padding: 14px 22px;
            border-bottom: 1px solid var(--line);
            display: none;
            align-items: center;
            gap: 12px;
            background: var(--surface);
        }
        .chat-head.show { display: flex; }
        .chat-head-info { min-width: 0; }
        .chat-head-name {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .chat-head-phone {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            margin-top: 2px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: var(--line-hi); border-radius: 3px; }

        .msg {
            max-width: 70%;
            padding: 10px 14px;
            font-size: 13.5px;
            line-height: 1.5;
            border-radius: 14px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .msg.mine {
            align-self: flex-end;
            background: var(--accent);
            color: #04121a;
            font-weight: 500;
            border-bottom-right-radius: 4px;
        }
        .msg.theirs {
            align-self: flex-start;
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--line);
            border-bottom-left-radius: 4px;
        }

        .composer {
            padding: 14px 18px;
            border-top: 1px solid var(--line);
            display: none;
            gap: 10px;
            background: var(--surface);
        }
        .composer.show { display: flex; }
        .composer input {
            flex: 1;
            padding: 11px 15px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 9px;
            color: var(--text);
            font-family: inherit;
            font-size: 13.5px;
            outline: none;
            transition: border-color 0.15s;
        }
        .composer input:focus { border-color: var(--accent-dim); }
        .composer input::placeholder { color: var(--text-mute); }

        .send-btn {
            padding: 0 20px;
            background: var(--accent);
            border: none;
            border-radius: 9px;
            color: #04121a;
            font-family: inherit;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .send-btn svg { width: 14px; height: 14px; }
        .send-btn:hover { background: #6ad5f5; }
        .send-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="bg"></div>

    <div class="shell">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="me">
                <div class="avatar" id="myAvatar"></div>
                <div class="me-info">
                    <div class="me-name" id="myName">Loading</div>
                    <div class="me-phone" id="myPhone">—</div>
                </div>
                <div class="me-actions">
                    <a href="profile.html" class="icon-btn" title="Edit profil">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
                        </svg>
                    </a>
                    <a href="owner.html" class="icon-btn owner-active" id="ownerBtn" style="display:none;" title="Panel owner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7l3-7z"/>
                        </svg>
                    </a>
                    <button class="icon-btn danger" id="logoutBtn" title="Keluar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="search">
                <div class="search-input-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Cari nomor atau nama">
                </div>
                <div class="search-hint" id="searchHint">Ketik nomor lengkap untuk menemukan pengguna lain</div>
            </div>

            <div class="search-result" id="searchResult"></div>

            <div class="list-scroll" id="userList">
                <div style="padding: 20px; text-align: center; color: var(--text-mute); font-size: 12px;">Memuat</div>
            </div>
        </aside>

        <!-- CHAT -->
        <main class="chat">
            <div class="empty" id="emptyChat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                </svg>
                <p>Pilih percakapan untuk mulai</p>
            </div>

            <div class="chat-head" id="chatHeader">
                <div class="avatar" id="chatAvatar"></div>
                <div class="chat-head-info">
                    <div class="chat-head-name" id="chatName">—</div>
                    <div class="chat-head-phone" id="chatPhone">—</div>
                </div>
            </div>

            <div class="messages" id="messages"></div>

            <div class="composer" id="composer">
                <input type="text" id="messageInput" placeholder="Tulis pesan..." autocomplete="off">
                <button class="send-btn" id="sendBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                    Kirim
                </button>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hlhlpznffrnuvxgcuwiu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__Xm9KHWul4yOcvbH9cPAGg_h_A4s0_O';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const OWNER_PHONE = '085290324268';

        const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

        let currentUser = null;
        let currentProfile = null;
        let currentChatUser = null;
        let messageSubscription = null;
        let allUsers = [];
        let isOwner = false;

        function badgeHTML(badge) {
            if (badge === 'red')  return `<span class="badge red" title="Owner">${CHECK_SVG}</span>`;
            if (badge === 'blue') return `<span class="badge blue" title="Terverifikasi">${CHECK_SVG}</span>`;
            return '';
        }

        function avatarHTML(user, large = false) {
            const cls = large ? 'avatar lg' : 'avatar';
            if (user.avatar_url) {
                return `<div class="${cls}" style="background-image:url('${user.avatar_url}'); color:transparent;"></div>`;
            }
            const initial = (user.full_name || user.username || 'U').charAt(0).toUpperCase();
            return `<div class="${cls}">${initial}</div>`;
        }

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;

            const { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
            currentProfile = profile;
            isOwner = profile.badge === 'red';

            document.getElementById('myName').innerHTML = (profile.full_name || profile.username || 'User') + badgeHTML(profile.badge);
            document.getElementById('myPhone').textContent = profile.phone_number || '—';

            const myAvatar = document.getElementById('myAvatar');
            if (profile.avatar_url) {
                myAvatar.style.backgroundImage = `url('${profile.avatar_url}')`;
            } else {
                myAvatar.textContent = (profile.full_name || 'U').charAt(0).toUpperCase();
            }

            if (isOwner) {
                document.getElementById('ownerBtn').style.display = 'inline-flex';
                document.getElementById('searchHint').textContent = 'Mode owner: semua pengguna tampil di daftar';
            }

            await loadUsers();
        }

        async function loadUsers() {
            const { data } = await sb.from('profiles').select('*').neq('id', currentUser.id);
            allUsers = data || [];
            renderList();
        }

        function getVisible() {
            if (isOwner) return allUsers;
            return allUsers.filter(u => u.phone_number === OWNER_PHONE);
        }

        function renderList() {
            const list = document.getElementById('userList');
            const visible = getVisible();
            let html = '';

            html += `<div class="list-label">${isOwner ? 'Semua pengguna · ' + visible.length : 'Owner'}</div>`;

            if (visible.length === 0) {
                html += `<div style="padding: 24px 20px; text-align: center; color: var(--text-mute); font-size: 12px; line-height: 1.5;">
                    Belum ada kontak tersedia.<br>Gunakan pencarian untuk menemukan pengguna lain.
                </div>`;
                list.innerHTML = html;
                return;
            }

            html += visible.map(u => `
                <div class="user-item" data-id="${u.id}" data-name="${escapeAttr(u.full_name || u.username || 'User')}" data-phone="${u.phone_number || '-'}" data-avatar="${u.avatar_url || ''}" data-badge="${u.badge || 'none'}">
                    ${avatarHTML(u)}
                    <div class="user-meta">
                        <div class="user-name">${u.full_name || u.username}${badgeHTML(u.badge)}</div>
                        <div class="user-phone">${u.phone_number || '—'}</div>
                    </div>
                </div>
            `).join('');

            list.innerHTML = html;

            list.querySelectorAll('.user-item').forEach(el => {
                el.addEventListener('click', () => {
                    list.querySelectorAll('.user-item').forEach(i => i.classList.remove('active'));
                    el.classList.add('active');
                    openChat(el.dataset.id, el.dataset.name, el.dataset.phone, el.dataset.avatar, el.dataset.badge);
                });
            });
        }

        function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

        // === SEARCH ===
        const searchInput = document.getElementById('searchInput');
        const searchResult = document.getElementById('searchResult');

        searchInput.addEventListener('input', (e) => {
            const q = e.target.value.trim();
            searchResult.className = 'search-result';
            searchResult.innerHTML = '';
            searchResult.onclick = null;

            if (!q) return;

            let matched;
            if (isOwner) {
                matched = allUsers.filter(u =>
                    (u.full_name || '').toLowerCase().includes(q.toLowerCase()) ||
                    (u.username || '').toLowerCase().includes(q.toLowerCase()) ||
                    (u.phone_number || '').includes(q)
                );
            } else {
                if (q.length < 6) return;
                matched = allUsers.filter(u => (u.phone_number || '') === q);
            }

            if (matched.length === 0) {
                if (!isOwner && q.length >= 6) {
                    searchResult.innerHTML = `<div class="empty-msg">Nomor "${q}" tidak ditemukan</div>`;
                    searchResult.classList.add('show');
                }
                return;
            }

            const u = matched[0];
            searchResult.innerHTML = `
                ${avatarHTML(u, true)}
                <div class="user-meta">
                    <div class="user-name">${u.full_name || u.username}${badgeHTML(u.badge)}</div>
                    <div class="user-phone">${u.phone_number || '—'}</div>
                </div>
            `;
            searchResult.classList.add('show');

            searchResult.onclick = () => {
                openChat(u.id, u.full_name || u.username, u.phone_number, u.avatar_url, u.badge);
                searchResult.className = 'search-result';
                searchInput.value = '';
            };
        });

        async function openChat(id, name, phone, avatar, badge) {
            currentChatUser = { id, name, phone, avatar };

            document.getElementById('emptyChat').style.display = 'none';
            document.getElementById('chatHeader').classList.add('show');
            document.getElementById('composer').classList.add('show');

            document.getElementById('chatName').innerHTML = name + badgeHTML(badge);
            document.getElementById('chatPhone').textContent = phone || '—';

            const ca = document.getElementById('chatAvatar');
            if (avatar) {
                ca.style.backgroundImage = `url('${avatar}')`;
                ca.textContent = '';
            } else {
                ca.style.backgroundImage = 'none';
                ca.textContent = name.charAt(0).toUpperCase();
            }

            await loadMessages(id);

            if (messageSubscription) messageSubscription.unsubscribe();
            messageSubscription = sb.channel('messages-realtime')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                    const m = payload.new;
                    if ((m.sender_id === currentUser.id && m.receiver_id === id) ||
                        (m.sender_id === id && m.receiver_id === currentUser.id)) {
                        appendMessage(m);
                    }
                })
                .subscribe();
        }

        async function loadMessages(otherId) {
            const { data } = await sb.from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${currentUser.id})`)
                .order('created_at', { ascending: true });

            const box = document.getElementById('messages');
            box.innerHTML = '';
            if (data) data.forEach(appendMessage);
        }

        function appendMessage(m) {
            const box = document.getElementById('messages');
            const mine = m.sender_id === currentUser.id;
            const div = document.createElement('div');
            div.className = `msg ${mine ? 'mine' : 'theirs'}`;
            div.textContent = m.content;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !currentChatUser) return;
            input.value = '';
            await sb.from('messages').insert({
                sender_id: currentUser.id,
                receiver_id: currentChatUser.id,
                content
            });
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await sb.auth.signOut();
            window.location.href = 'index.html';
        });

        init();
    </script>
</body>
