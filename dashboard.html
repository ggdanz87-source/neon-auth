<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon — Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0a0a0f; --surface: #111318; --surface-2: #181b22;
            --panel-left: #0d0f14; --line: #222631; --line-hi: #2d3342;
            --text: #e8ecf2; --text-dim: #86909f; --text-mute: #5c6575;
            --accent: #4cc9f0; --accent-dim: #1d6d85;
            --red: #ff4757; --blue: #3a86ff; --success: #2ec4b6; --purple: #9d4edd;
        }
        body.light-mode {
            --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f0f2f5;
            --panel-left: #e9edf2; --line: #dbe0e8; --line-hi: #c8cfdb;
            --text: #111318; --text-dim: #5c6575; --text-mute: #8b94a5;
            --accent: #0088cc; --accent-dim: #005f8f; --purple: #7209b7;
        }
        body {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; height: 100dvh; overflow: hidden; -webkit-font-smoothing: antialiased;
            user-select: none; transition: background 0.3s, color 0.3s;
        }
        
        .shell {
            display: flex; width: 100%; height: 100vh;
        }

        /* === SIDEBAR KIRI (IKON) === */
        .nav-sidebar {
            width: 68px; background: var(--panel-left);
            border-right: 1px solid var(--line);
            display: flex; flex-direction: column; align-items: center;
            padding: 15px 0; gap: 10px; flex-shrink: 0;
        }
        .nav-profile {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--surface-2); border: 1px solid var(--line);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: var(--accent); margin-bottom: 20px;
            overflow: hidden; background-size: cover; background-position: center;
            cursor: pointer;
        }
        .nav-btn {
            width: 46px; height: 46px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: transparent; border: none; color: var(--text-dim);
            cursor: pointer; transition: all 0.2s; position: relative;
        }
        .nav-btn:hover { background: var(--surface-2); color: var(--text); }
        .nav-btn.active { background: var(--surface-2); color: var(--accent); }
        .nav-btn svg { width: 22px; height: 22px; }
        
        .nav-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

        /* === PANEL KEDUA (LIST CHAT) === */
        .list-panel {
            width: 360px; background: var(--surface);
            border-right: 1px solid var(--line);
            display: flex; flex-direction: column; flex-shrink: 0;
            transition: transform 0.3s ease;
        }
        .list-header {
            padding: 20px; border-bottom: 1px solid var(--line);
            display: flex; justify-content: space-between; align-items: center;
        }
        .list-title { font-size: 20px; font-weight: 700; color: var(--text); }
        
        .search { padding: 10px 15px; border-bottom: 1px solid var(--line); }
        .search-input-wrap { position: relative; }
        .search-input-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-mute); pointer-events: none; }
        .search input {
            width: 100%; padding: 10px 12px 10px 36px; background: var(--bg);
            border: 1px solid var(--line); border-radius: 8px; color: var(--text);
            font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.15s;
        }
        .search input::placeholder { color: var(--text-mute); }
        .search input:focus { border-color: var(--accent-dim); }

        .list-scroll { flex: 1; overflow-y: auto; }
        .list-scroll::-webkit-scrollbar { width: 5px; }
        .list-scroll::-webkit-scrollbar-thumb { background: var(--line-hi); border-radius: 3px; }
        
        .list-label {
            padding: 12px 20px 6px; font-size: 11px; text-transform: uppercase;
            letter-spacing: 1px; color: var(--accent); font-weight: 700;
        }
        
        .user-item {
            padding: 12px 20px; display: flex; align-items: center; gap: 12px;
            cursor: pointer; border-left: 3px solid transparent; transition: background 0.12s;
        }
        .user-item:hover { background: var(--surface-2); }
        .user-item.active { background: var(--surface-2); border-left-color: var(--accent); }
        
        .avatar {
            width: 48px; height: 48px; border-radius: 50%; background: var(--surface-2);
            border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 16px; color: var(--accent);
            flex-shrink: 0; overflow: hidden; background-size: cover; background-position: center;
            position: relative;
        }
        
        /* Status Ring (Lingkaran Ungu) */
        .avatar.has-status::after {
            content: ''; position: absolute; inset: -3px;
            border-radius: 50%; border: 2px solid var(--purple);
            pointer-events: none;
        }

        .user-meta { min-width: 0; flex: 1; }
        .user-name {
            font-weight: 600; font-size: 14.5px; color: var(--text);
            display: flex; align-items: center; gap: 5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-phone { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 3px; }
        
        .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; flex-shrink: 0; }
        .online-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }

        /* === CHAT AREA === */
        .chat {
            flex: 1; display: flex; flex-direction: column;
            background: var(--bg); position: relative;
            /* Background Doodle WA */
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
            background-blend-mode: soft-light;
            background-size: 400px;
        }
        body.light-mode .chat {
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-blend-mode: overlay;
            opacity: 0.9;
        }
        
        .chat-head {
            padding: 10px 20px; border-bottom: 1px solid var(--line);
            display: none; align-items: center; gap: 12px;
            background: var(--surface); z-index: 5;
        }
        .chat-head.show { display: flex; }
        
        .back-btn { display: none; background: transparent; border: none; color: var(--text); cursor: pointer; padding: 5px; margin-left: -5px; }
        .back-btn svg { width: 20px; height: 20px; }

        .chat-head-info { flex: 1; min-width: 0; }
        .chat-head-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 5px; }
        .chat-head-phone { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
        
        .messages { flex: 1; overflow-y: auto; padding: 20px 40px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: var(--line-hi); border-radius: 3px; }
        
        /* BUBBLE CHAT */
        .msg {
            max-width: 65%; padding: 8px 12px; font-size: 14px;
            line-height: 1.4; border-radius: 8px; word-wrap: break-word; white-space: pre-wrap;
            cursor: pointer; position: relative; display: flex; flex-direction: column;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .msg.mine { align-self: flex-end; background: #005c4b; color: #e8ecf2; border-top-right-radius: 0; }
        body.light-mode .msg.mine { background: #d9fdd3; color: #111318; }
        
        .msg.theirs { align-self: flex-start; background: var(--surface-2); color: var(--text); border-top-left-radius: 0; }
        
        /* Reply UI */
        .reply-preview {
            background: rgba(0,0,0,0.15); border-left: 3px solid var(--accent);
            padding: 6px 10px; border-radius: 4px; margin-bottom: 6px;
            font-size: 12px; line-height: 1.3; display: flex; flex-direction: column; gap: 2px;
        }
        .msg.theirs .reply-preview { background: rgba(255,255,255,0.05); }
        .reply-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.8; }
        .reply-name { font-weight: 700; font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .msg img { max-width: 100%; border-radius: 6px; margin-top: 5px; display: block; }
        .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 3px; font-size: 10.5px; opacity: 0.7; }
        .check-svg { width: 14px; height: 14px; }

        /* Voice Note UI */
        .vn-container { display: flex; align-items: center; gap: 10px; min-width: 220px; padding: 4px; }
        .vn-play-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
        .vn-play-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .vn-waveform { flex: 1; height: 20px; display: flex; align-items: center; gap: 2px; opacity: 0.6; }
        .vn-waveform .bar { width: 3px; background: currentColor; border-radius: 2px; }
        .vn-duration { font-size: 11px; font-family: 'JetBrains Mono', monospace; opacity: 0.8; }
        .vn-hidden-audio { display: none !important; }

        /* COMPOSER (INPUT) */
        .composer {
            padding: 10px 20px; background: var(--surface);
            display: none; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 5;
        }
        .composer.show { display: flex; }
        
        .reply-bar {
            width: 100%; padding: 8px 12px; background: var(--surface-2);
            border-left: 3px solid var(--accent); border-radius: 6px;
            display: none; justify-content: space-between; align-items: center;
            font-size: 12px; color: var(--text-dim);
        }
        .reply-bar.show { display: flex; }
        .reply-bar-content { min-width: 0; display: flex; flex-direction: column; }
        .reply-bar-title { font-size: 10px; color: var(--accent); font-weight: bold; }
        .reply-bar-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
        .reply-bar-close { cursor: pointer; color: var(--red); font-weight: bold; padding: 0 5px; }

        .composer input[type="text"] {
            flex: 1; padding: 12px 16px; background: var(--bg); min-width: 100px;
            border: 1px solid var(--line); border-radius: 24px; color: var(--text);
            font-family: inherit; font-size: 15px; outline: none;
        }
        .composer input[type="text"]:focus { border-color: var(--accent-dim); }
        
        .action-btn {
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            background: var(--bg); border: 1px solid var(--line); border-radius: 50%;
            color: var(--text-dim); cursor: pointer; flex-shrink: 0;
        }
        .action-btn:hover { color: var(--accent); }
        .action-btn svg { width: 20px; height: 20px; }
        .action-btn.recording { background: var(--red); color: #fff; animation: pulse 1s infinite; }
        input[type="file"] { display: none; }

        .send-btn {
            width: 44px; height: 44px; background: var(--accent); border: none; border-radius: 50%;
            color: #04121a; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .send-btn svg { width: 18px; height: 18px; }
        .send-btn:hover { background: #6ad5f5; }
        .send-btn span { display: none; }

        /* CONTEXT MENU & MODAL */
        .ctx-menu {
            position: fixed; z-index: 99999; background: var(--surface);
            border: 1px solid var(--line-hi); border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); padding: 6px;
            display: none; min-width: 180px;
        }
        .ctx-menu.show { display: block; }
        .ctx-item { padding: 9px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .ctx-item:hover { background: var(--surface-2); }
        .ctx-item.danger { color: var(--red); }
        
        .modal-overlay {
            position: fixed; inset: 0; z-index: 100000;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--surface); border: 1px solid var(--line-hi);
            border-radius: 12px; padding: 24px; max-width: 340px; width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }
        .modal-title { font-weight: 600; font-size: 16px; margin-bottom: 8px; color: var(--text); }
        .modal-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-cancel { padding: 9px 16px; background: transparent; border: 1px solid var(--line-hi); border-radius: 7px; color: var(--text); cursor: pointer; }
        .btn-confirm-del { padding: 9px 16px; background: var(--red); border: none; border-radius: 7px; color: #fff; cursor: pointer; }

        /* === STATUS VIEWER === */
        .status-viewer {
            position: fixed; inset: 0; z-index: 200000;
            background: #000; display: none; flex-direction: column;
        }
        .status-viewer.show { display: flex; }
        .status-header { padding: 15px 20px; display: flex; align-items: center; gap: 12px; z-index: 10; }
        .status-progress { display: flex; gap: 4px; position: absolute; top: 10px; left: 20px; right: 20px; }
        .status-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
        .status-bar-fill { height: 100%; background: #fff; width: 0%; transition: width 0.1s linear; }
        .status-content { flex: 1; display: flex; align-items: center; justify-content: center; }
        .status-content img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .status-close { position: absolute; top: 20px; right: 20px; color: #fff; cursor: pointer; z-index: 10; }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .nav-sidebar { display: none; } /* Sembunyiin sidebar ikon di HP */
            
            .list-panel {
                width: 100%; position: absolute; inset: 0; z-index: 10;
                transform: translateX(0); border-right: none;
            }
            body.show-chat .list-panel { transform: translateX(-100%); }
            
            .chat {
                position: absolute; inset: 0; z-index: 20;
                transform: translateX(100%); transition: transform 0.3s ease;
            }
            body.show-chat .chat { transform: translateX(0); }
            
            .back-btn { display: block; }
            .messages { padding: 15px; }
            .msg { max-width: 85%; }
            
            /* Bottom Nav buat HP */
            .mobile-nav {
                display: flex; background: var(--panel-left);
                border-top: 1px solid var(--line); justify-content: space-around;
                padding: 10px 0; z-index: 30; position: relative;
            }
        }
        @media (min-width: 769px) {
            .mobile-nav { display: none; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <!-- NAVIGASI KIRI (DESKTOP) -->
        <nav class="nav-sidebar">
            <div class="nav-profile" id="myAvatarNav"></div>
            
            <button class="nav-btn active" id="navChatBtn" title="Chat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            </button>
            
            <button class="nav-btn" id="navStatusBtn" title="Status">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </button>

            <div class="nav-bottom">
                <a href="profile.html" class="nav-btn" title="Edit Profil">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                </a>
                <button class="nav-btn" id="themeBtn" title="Ganti Tema">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
                <button class="nav-btn" id="logoutBtn" title="Keluar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </nav>

        <!-- PANEL LIST CHAT -->
        <aside class="list-panel" id="listPanel">
            <div class="list-header">
                <div class="list-title" id="panelTitle">Chat</div>
                <!-- Tombol Owner (muncul kalo owner) -->
                <a href="owner.html" class="nav-btn owner-active" id="ownerBtn" style="display:none; width:36px; height:36px; background:var(--surface-2);" title="Panel owner">
                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7l3-7z"/></svg>
                </a>
            </div>

            <div class="search" id="searchContainer">
                <div class="search-input-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <input type="text" id="searchInput" placeholder="Cari nomor atau nama...">
                </div>
            </div>

            <div class="search-result" id="searchResult"></div>

            <!-- List User / Chat -->
            <div class="list-scroll" id="chatListContainer">
                <div class="list-label" id="listLabel">Semua Pengguna</div>
                <div id="userList">
                    <div style="padding: 20px; text-align: center; color: var(--text-mute); font-size: 12px;">Memuat...</div>
                </div>
            </div>

            <!-- List Status -->
            <div class="list-scroll" id="statusListContainer" style="display: none;">
                <div class="list-label">Status Terbaru</div>
                <div id="statusList">
                    <div style="padding: 20px; text-align: center; color: var(--text-mute); font-size: 12px;">Belum ada status.</div>
                </div>
            </div>
        </aside>

        <!-- AREA CHAT -->
        <main class="chat" id="mainChat">
            <div class="empty" id="emptyChat" style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%; color:var(--text-mute); gap:15px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:60px;height:60px;opacity:0.3;"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                <p>Pilih percakapan atau status untuk mulai</p>
            </div>

            <!-- Header Chat -->
            <div class="chat-head" id="chatHeader">
                <button class="back-btn" id="backBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                </button>
                <div class="avatar" id="chatAvatar"></div>
                <div class="chat-head-info">
                    <div class="chat-head-name" id="chatName">—</div>
                    <div class="chat-head-phone" id="chatPhone">—</div>
                </div>
            </div>

            <!-- Area Pesan -->
            <div class="messages" id="messages"></div>

            <!-- Input Chat -->
            <div class="composer" id="composer">
                <div class="reply-bar" id="replyBar">
                    <div class="reply-bar-content">
                        <div class="reply-bar-title">Membalas pesan:</div>
                        <div id="replyText" class="reply-bar-text"></div>
                    </div>
                    <span class="reply-bar-close" id="cancelReply">✕</span>
                </div>

                <button class="action-btn" id="attachBtn" title="Kirim Gambar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <input type="file" id="fileInput" accept="image/*">

                <button class="action-btn" id="recordBtn" title="Rekam Suara">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </button>

                <input type="text" id="messageInput" placeholder="Tulis pesan..." autocomplete="off">
                
                <button class="send-btn" id="sendBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </main>
    </div>

    <!-- MODAL, CONTEXT MENU, STATUS VIEWER (Sama kayak sebelumnya) -->
    <div class="ctx-menu" id="ctxMenu">
        <div class="ctx-item" id="ctxReply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 00-4-4H4"/></svg> Balas</div>
        <div class="ctx-item danger" id="ctxDeleteAll" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg> Hapus untuk semua</div>
        <div class="ctx-item danger" id="ctxDeleteMe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg> Hapus untuk saya</div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Konfirmasi</div>
            <div class="modal-desc" id="modalDesc">Yakin?</div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">Batal</button>
                <button class="btn-confirm-del" id="modalConfirm">Ya</button>
            </div>
        </div>
    </div>

    <!-- STATUS VIEWER -->
    <div class="status-viewer" id="statusViewer">
        <div class="status-header">
            <div class="avatar" id="viewerAvatar" style="width:40px;height:40px;"></div>
            <div style="color:#fff; font-weight:600;" id="viewerName">Nama</div>
            <div class="status-close" id="closeViewer">✕</div>
        </div>
        <div class="status-progress" id="statusProgress"></div>
        <div class="status-content" id="statusContent"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // [LOGIC JS SAMA KAYAK SEBELUMNYA, GW TAMBAHIN LOGIC STATUS & NAV]
        
        // ... (PASTE LOGIC JS LO YANG SEBELUMNYA DI SINI, TERUS TAMBAHIN DI BAWAH INI) ...
        
        // === FITUR STATUS ===
        let currentTab = 'chat'; // 'chat' atau 'status'
        
        document.getElementById('navChatBtn').addEventListener('click', () => {
            currentTab = 'chat';
            document.getElementById('navChatBtn').classList.add('active');
            document.getElementById('navStatusBtn').classList.remove('active');
            document.getElementById('chatListContainer').style.display = 'block';
            document.getElementById('statusListContainer').style.display = 'none';
            document.getElementById('searchContainer').style.display = 'block';
            document.getElementById('panelTitle').textContent = 'Chat';
        });

        document.getElementById('navStatusBtn').addEventListener('click', () => {
            currentTab = 'status';
            document.getElementById('navStatusBtn').classList.add('active');
            document.getElementById('navChatBtn').classList.remove('active');
            document.getElementById('chatListContainer').style.display = 'none';
            document.getElementById('statusListContainer').style.display = 'block';
            document.getElementById('searchContainer').style.display = 'none';
            document.getElementById('panelTitle').textContent = 'Status';
            loadStatuses();
        });

        async function loadStatuses() {
            // Ambil semua status 24 jam terakhir
            const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const { data: statuses } = await sb.from('status')
                .select('*, profiles(full_name, avatar_url)')
                .gte('created_at', yesterday)
                .order('created_at', { ascending: false });

            const container = document.getElementById('statusList');
            if (!statuses || statuses.length === 0) {
                container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-mute);">Belum ada status.</div>';
                return;
            }

            container.innerHTML = statuses.map(s => {
                const name = s.profiles?.full_name || 'User';
                const avatar = s.profiles?.avatar_url || '';
                const avatarHTML = avatar ? `<div class="avatar" style="background-image:url('${avatar}');"></div>` : `<div class="avatar">${name.charAt(0)}</div>`;
                
                return `
                <div class="user-item" onclick="viewStatus('${s.id}', '${name}', '${s.file_url}')">
                    ${avatarHTML}
                    <div class="user-meta">
                        <div class="user-name">${name}</div>
                        <div class="user-phone">${new Date(s.created_at).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function viewStatus(id, name, fileUrl) {
            const viewer = document.getElementById('statusViewer');
            document.getElementById('viewerName').textContent = name;
            document.getElementById('statusContent').innerHTML = `<img src="${fileUrl}" style="max-width:100%; max-height:80vh;">`;
            viewer.classList.add('show');

            // Progress bar animasi sederhana
            const progress = document.getElementById('statusProgress');
            progress.innerHTML = `<div class="status-bar"><div class="status-bar-fill" style="animation: fillBar 5s linear forwards;"></div></div>`;
            
            setTimeout(() => { viewer.classList.remove('show'); }, 5000);
        }

        document.getElementById('closeViewer').addEventListener('click', () => {
            document.getElementById('statusViewer').classList.remove('show');
        });

        // Tombol buat Upload Status (munculin input file)
        // Tambahin ini di UI, misal pas klik avatar sendiri di Nav
        document.getElementById('myAvatarNav').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if(!file) return;
                const fileName = `status/${currentUser.id}/${Date.now()}.jpg`;
                const { error: upErr } = await sb.storage.from('chat_uploads').upload(fileName, file);
                if(upErr) return alert('Gagal upload status: ' + upErr.message);
                const { data: urlData } = sb.storage.from('chat_uploads').getPublicUrl(fileName);
                
                await sb.from('status').insert({
                    user_id: currentUser.id,
                    file_url: urlData.publicUrl,
                    file_type: 'image'
                });
                alert('Status berhasil diupload!');
                loadStatuses();
            };
            input.click();
        });
    </script>
    <style>
        @keyframes fillBar { from { width: 0%; } to { width: 100%; } }
    </style>
</body>
</html>
