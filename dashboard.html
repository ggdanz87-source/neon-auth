<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon — Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0a0a0f; 
            --glass: rgba(20, 24, 33, 0.65); 
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.15);
            --surface: #111318; --surface-2: #181b22;
            --panel-left: #0d0f14; --line: #222631; --line-hi: #2d3342;
            --text: #e8ecf2; --text-dim: #86909f; --text-mute: #5c6575;
            --accent: #4cc9f0; --accent-dim: #1d6d85;
            --red: #ff4757; --blue: #3a86ff; --success: #2ec4b6; --purple: #9d4edd;
        }
        body.light-mode {
            --bg: #f4f6f9; 
            --glass: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(0, 0, 0, 0.1);
            --glass-hover: rgba(0, 0, 0, 0.08);
            --surface: #ffffff; --surface-2: #f0f2f5;
            --panel-left: #e9edf2; --line: #dbe0e8; --line-hi: #c8cfdb;
            --text: #111318; --text-dim: #5c6575; --text-mute: #8b94a5;
            --accent: #0088cc; --accent-dim: #005f8f; --purple: #7209b7;
        }
        body {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; height: 100dvh; overflow: hidden; -webkit-font-smoothing: antialiased;
            user-select: none; transition: background 0.3s, color 0.3s;
        }
        
        .shell {
            display: flex; width: 100%; height: 100vh; flex-direction: column;
        }

        .main-layout {
            display: flex; flex: 1; overflow: hidden;
        }

        /* SIDEBAR KIRI (LIQUID GLASS) */
        .nav-sidebar {
            width: 68px; background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column; align-items: center;
            padding: 15px 0; gap: 10px; flex-shrink: 0; z-index: 100;
        }
        .nav-profile {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--surface-2); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: var(--accent); margin-bottom: 10px;
            overflow: hidden; background-size: cover; background-position: center;
            cursor: pointer;
        }
        .nav-btn {
            width: 46px; height: 46px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: transparent; border: none; color: var(--text-dim);
            cursor: pointer; transition: all 0.2s; position: relative;
        }
        .nav-btn:hover { background: var(--glass-hover); color: var(--text); }
        .nav-btn.active { background: var(--glass-hover); color: var(--accent); }
        .nav-btn svg { width: 22px; height: 22px; }
        
        .nav-btn.owner-btn { background: rgba(255, 71, 87, 0.1); color: var(--red); border: 1px solid rgba(255, 71, 87, 0.3); display: none; }
        .nav-btn.owner-btn:hover { background: rgba(255, 71, 87, 0.2); }

        .nav-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }

        /* PANEL LIST CHAT (LIQUID GLASS) */
        .list-panel {
            width: 360px; background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column; flex-shrink: 0;
            transition: transform 0.3s ease; z-index: 90;
        }
        .list-header {
            padding: 20px; border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .list-title { font-size: 20px; font-weight: 700; color: var(--text); }
        
        .header-actions { display: flex; gap: 10px; }
        .action-icon-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: var(--surface-2); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-dim); cursor: pointer; transition: 0.2s;
        }
        .action-icon-btn:hover { background: var(--glass-hover); color: var(--accent); }

        .search { padding: 10px 15px; border-bottom: 1px solid var(--glass-border); }
        .search-input-wrap { position: relative; }
        .search-input-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-mute); pointer-events: none; }
        .search input {
            width: 100%; padding: 10px 12px 10px 36px; background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text);
            font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.15s;
        }
        body.light-mode .search input { background: rgba(255,255,255,0.5); }
        .search input::placeholder { color: var(--text-mute); }
        .search input:focus { border-color: var(--accent-dim); }

        .list-scroll { flex: 1; overflow-y: auto; }
        .list-scroll::-webkit-scrollbar { width: 5px; }
        .list-scroll::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 3px; }
        
        .list-label {
            padding: 12px 20px 6px; font-size: 11px; text-transform: uppercase;
            letter-spacing: 1px; color: var(--accent); font-weight: 700;
        }
        
        .user-item {
            padding: 12px 20px; display: flex; align-items: center; gap: 12px;
            cursor: pointer; border-left: 3px solid transparent; transition: background 0.12s;
        }
        .user-item:hover { background: var(--glass-hover); }
        .user-item.active { background: var(--glass-hover); border-left-color: var(--accent); }
        
        .avatar {
            width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 16px; color: var(--accent);
            flex-shrink: 0; overflow: hidden; background-size: cover; background-position: center;
            position: relative;
        }
        
        .avatar.has-status::after {
            content: ''; position: absolute; inset: -3px;
            border-radius: 50%; border: 2px solid var(--purple);
            pointer-events: none;
        }

        .user-meta { min-width: 0; flex: 1; }
        .user-name {
            font-weight: 600; font-size: 14.5px; color: var(--text);
            display: flex; align-items: center; gap: 5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-phone { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 3px; }
        
        .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; flex-shrink: 0; }
        .online-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }

        /* CHAT AREA */
        .chat {
            flex: 1; display: flex; flex-direction: column;
            background: var(--bg); position: relative;
            transition: background 0.5s ease;
        }
        
        .chat.active-chat {
            background-image: url('https://4kwallpapers.com/images/walls/thumbs_3t/27569.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
        
        .chat::before {
            content: ''; position: absolute; inset: 0;
            background: rgba(0,0,0,0.4); z-index: 1; opacity: 0; transition: 0.3s;
        }
        .chat.active-chat::before { opacity: 1; }
        body.light-mode .chat.active-chat::before { background: rgba(255,255,255,0.3); }

        .chat-head {
            padding: 10px 20px; border-bottom: 1px solid var(--glass-border);
            display: none; align-items: center; gap: 12px;
            background: var(--glass); backdrop-filter: blur(20px); z-index: 10;
        }
        .chat-head.show { display: flex; }
        
        .back-btn { display: none; background: transparent; border: none; color: var(--text); cursor: pointer; padding: 5px; margin-left: -5px; }
        .back-btn svg { width: 20px; height: 20px; }

        .chat-head-info { flex: 1; min-width: 0; }
        .chat-head-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 5px; }
        .chat-head-phone { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
        
        .messages { flex: 1; overflow-y: auto; padding: 20px 40px; display: flex; flex-direction: column; gap: 6px; z-index: 10; position: relative; }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 3px; }
        
        .msg {
            max-width: 65%; padding: 10px 14px; font-size: 14px;
            line-height: 1.4; border-radius: 16px; word-wrap: break-word; white-space: pre-wrap;
            cursor: pointer; position: relative; display: flex; flex-direction: column;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid var(--glass-border);
        }
        .msg.mine { align-self: flex-end; background: rgba(0, 92, 75, 0.85); color: #e8ecf2; border-bottom-right-radius: 4px; }
        body.light-mode .msg.mine { background: rgba(217, 253, 211, 0.85); color: #111318; }
        .msg.theirs { align-self: flex-start; background: var(--glass); color: var(--text); border-bottom-left-radius: 4px; }
        
        .reply-preview {
            background: rgba(0,0,0,0.2); border-left: 3px solid var(--accent);
            padding: 6px 10px; border-radius: 4px; margin-bottom: 6px;
            font-size: 12px; line-height: 1.3; display: flex; flex-direction: column; gap: 2px;
        }
        .reply-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.8; }
        .reply-name { font-weight: 700; font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .msg img { max-width: 100%; border-radius: 6px; margin-top: 5px; display: block; }
        .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 3px; font-size: 10.5px; opacity: 0.7; }
        .check-svg { width: 14px; height: 14px; }

        .vn-container { display: flex; align-items: center; gap: 10px; min-width: 220px; padding: 4px; }
        .vn-play-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; }
        .vn-play-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .vn-waveform { flex: 1; height: 20px; display: flex; align-items: center; gap: 2px; opacity: 0.6; }
        .vn-waveform .bar { width: 3px; background: currentColor; border-radius: 2px; }
        .vn-duration { font-size: 11px; font-family: 'JetBrains Mono', monospace; opacity: 0.8; }
        .vn-hidden-audio { display: none !important; }

        /* COMPOSER (INPUT) LIQUID GLASS */
        .composer {
            padding: 12px 20px; background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: none; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 10;
        }
        .composer.show { display: flex; }
        
        .reply-bar {
            width: 100%; padding: 8px 12px; background: rgba(0,0,0,0.2);
            border-left: 3px solid var(--accent); border-radius: 6px;
            display: none; justify-content: space-between; align-items: center;
            font-size: 12px; color: var(--text-dim);
        }
        .reply-bar.show { display: flex; }
        .reply-bar-content { min-width: 0; display: flex; flex-direction: column; }
        .reply-bar-title { font-size: 10px; color: var(--accent); font-weight: bold; }
        .reply-bar-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
        .reply-bar-close { cursor: pointer; color: var(--red); font-weight: bold; padding: 0 5px; }

        .composer input[type="text"] {
            flex: 1; padding: 12px 16px; background: rgba(0,0,0,0.2); min-width: 100px;
            border: 1px solid var(--glass-border); border-radius: 24px; color: var(--text);
            font-family: inherit; font-size: 15px; outline: none;
        }
        .composer input[type="text"]:focus { border-color: var(--accent-dim); }
        
        .action-btn {
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            background: var(--glass); border: 1px solid var(--glass-border); border-radius: 50%;
            color: var(--text-dim); cursor: pointer; flex-shrink: 0;
        }
        .action-btn:hover { color: var(--accent); }
        .action-btn svg { width: 20px; height: 20px; }
        .action-btn.recording { background: var(--red); color: #fff; animation: pulse 1s infinite; }
        input[type="file"] { display: none; }

        .send-btn {
            width: 44px; height: 44px; background: var(--accent); border: none; border-radius: 50%;
            color: #04121a; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .send-btn svg { width: 18px; height: 18px; }
        .send-btn:hover { background: #6ad5f5; }

        /* MODALS GLASS */
        .ctx-menu {
            position: fixed; z-index: 99999; background: var(--glass);
            backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); padding: 6px;
            display: none; min-width: 180px;
        }
        .ctx-menu.show { display: block; }
        .ctx-item { padding: 9px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .ctx-item:hover { background: var(--glass-hover); }
        .ctx-item.danger { color: var(--red); }
        
        .modal-overlay {
            position: fixed; inset: 0; z-index: 300000; 
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 24px; max-width: 340px; width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-title { font-weight: 600; font-size: 16px; margin-bottom: 8px; color: var(--text); }
        .modal-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-cancel { padding: 9px 16px; background: transparent; border: 1px solid var(--glass-border); border-radius: 7px; color: var(--text); cursor: pointer; }
        .btn-confirm-del { padding: 9px 16px; background: var(--red); border: none; border-radius: 7px; color: #fff; cursor: pointer; }

        /* STATUS VIEWER */
        .status-viewer {
            position: fixed; inset: 0; z-index: 200000;
            background: #000; display: none; flex-direction: column;
        }
        .status-viewer.show { display: flex; }
        .status-header { padding: 15px 20px; display: flex; align-items: center; gap: 12px; z-index: 10; }
        .status-progress { display: flex; gap: 4px; position: absolute; top: 10px; left: 20px; right: 20px; }
        .status-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
        .status-bar-fill { height: 100%; background: #fff; width: 0%; transition: width 0.1s linear; }
        .status-content { flex: 1; display: flex; align-items: center; justify-content: center; }
        .status-content img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .status-close { position: absolute; top: 20px; right: 20px; color: #fff; cursor: pointer; z-index: 10; }
        
        .status-delete { 
            position: absolute; top: 20px; right: 60px; color: #fff; cursor: pointer; 
            z-index: 10; display: none; background: rgba(255,0,0,0.3); padding: 5px; border-radius: 50%;
        }
        .status-delete svg { width: 20px; height: 20px; fill: #fff; }

        /* MODAL GROUP CHAT */
        .group-modal {
            position: fixed; inset: 0; z-index: 300000;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
        }
        .group-modal.show { display: flex; }
        .group-box {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 24px; max-width: 400px; width: 90%;
            max-height: 80vh; overflow-y: auto;
        }
        .group-box h3 { margin-bottom: 15px; font-size: 18px; }
        .group-box input {
            width: 100%; padding: 10px; margin-bottom: 15px;
            background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border);
            border-radius: 8px; color: var(--text); outline: none;
        }
        .member-list {
            max-height: 200px; overflow-y: auto;
            border: 1px solid var(--glass-border); border-radius: 8px; margin-bottom: 15px;
        }
        .member-item {
            padding: 8px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer;
        }
        .member-item:hover { background: var(--glass-hover); }
        .member-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

        /* MOBILE BOTTOM NAV */
        .mobile-nav {
            display: none; background: var(--glass);
            backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border);
            justify-content: space-around; padding: 8px 0; z-index: 30;
        }
        .mobile-nav-btn {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            background: transparent; border: none; color: var(--text-dim);
            font-size: 10px; font-family: inherit; cursor: pointer; width: 60px;
        }
        .mobile-nav-btn.active { color: var(--accent); }
        .mobile-nav-btn svg { width: 22px; height: 22px; }
        
        @keyframes fillBar { from { width: 0%; } to { width: 100%; } }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .nav-sidebar { display: none; }
            .mobile-nav { display: flex; }
            
            .list-panel {
                width: 100%; position: absolute; inset: 0; z-index: 10;
                transform: translateX(0); border-right: none;
            }
            body.show-chat .list-panel { transform: translateX(-100%); }
            
            .chat {
                position: absolute; inset: 0; z-index: 20;
                transform: translateX(100%); transition: transform 0.3s ease;
            }
            body.show-chat .chat { transform: translateX(0); }
            
            .back-btn { display: block; }
            .messages { padding: 15px; }
            .msg { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="main-layout">
            <!-- NAVIGASI KIRI (DESKTOP) -->
            <nav class="nav-sidebar">
                <div class="nav-profile" id="myAvatarNav"></div>
                
                <button class="nav-btn active" id="navChatBtn" title="Chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                </button>
                
                <button class="nav-btn" id="navStatusBtn" title="Status">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </button>

                <a href="owner.html" class="nav-btn owner-btn" id="ownerBtn" title="Panel Owner">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7l3-7z"/></svg>
                </a>

                <div class="nav-bottom">
                    <a href="profile.html" class="nav-btn" title="Edit Profil">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    </a>
                    <button class="nav-btn" id="themeBtn" title="Ganti Tema">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    </button>
                    <button class="nav-btn" id="logoutBtn" title="Keluar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </div>
            </nav>

            <!-- PANEL LIST CHAT -->
            <aside class="list-panel" id="listPanel">
                <div class="list-header">
                    <div class="list-title" id="panelTitle">Chat</div>
                    <div class="header-actions">
                        <button class="action-icon-btn" id="headerActionBtn" title="Tambah">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        </button>
                    </div>
                </div>

        function normalizeText(text) {
            return text.toLowerCase()
                .replace(/[0@]/g, 'o').replace(/[1!|]/g, 'i').replace(/3/g, 'e')
                .replace(/4/g, 'a').replace(/5/g, 's').replace(/7/g, 't')

        }

        function detectToxic(text) {
            const norm = normalizeText(text);
            const words = norm.split(' ');
            const matched = [];
            TOXIC_WORDS.forEach(w => {
                if (words.includes(w) || norm.includes(w)) {
                    if (!matched.includes(w)) matched.push(w);
                }
            });
            if (matched.length === 0) return { matched: [], severity: null };
            const isHigh = matched.some(w => HIGH_SEVERITY_WORDS.includes(w));
            return { matched, severity: isHigh ? 'high' : 'low' };
        }

        function playNotifSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) { console.error("Audio error:", e); }
        }

                switchTab('status');
                if (currentTab === 'status') await loadStatuses();
                showModal('Sukses', 'Status berhasil diupload!', 'Oke', 'primary', null);
            };
            input.click();
        }

        async function loadUsers() {
            const { data } = await sb.from('profiles').select('*').neq('id', currentUser.id);
            allUsers = data || [];
            renderList();
        }

        function getVisible() {
            if (isOwner) return allUsers;
            return allUsers.filter(u => u.phone_number === OWNER_PHONE);
        }

        function isUserOnline(lastSeenStr) {
            if (!lastSeenStr) return false;
            const lastSeen = new Date(lastSeenStr).getTime();
            const now = new Date().getTime();
            return (now - lastSeen) < 60000; 
        }

        function renderList() {
            const list = document.getElementById('userList');
            const visible = getVisible();
            
            if (visible.length === 0) {
                list.innerHTML = `<div style="padding: 24px 20px; text-align: center; color: var(--text-mute); font-size: 12px; line-height: 1.5;">
                    Belum ada kontak tersedia.<br>Gunakan pencarian untuk menemukan pengguna lain.
                </div>`;
                return;
            }

            list.innerHTML = visible.map(u => {
                const online = isUserOnline(u.last_seen);
                return `
                <div class="user-item" data-id="${u.id}" data-name="${escapeAttr(u.full_name || u.username || 'User')}" data-phone="${u.phone_number || '-'}" data-avatar="${u.avatar_url || ''}" data-badge="${u.badge || 'none'}" data-online="${online}" data-isgroup="false">
                    ${avatarHTML(u)}
                    <div class="user-meta">
                        <div class="user-name">${u.full_name || u.username}${badgeHTML(u.badge)}</div>
                        <div class="user-phone">
                            <span class="online-dot ${online ? 'online' : ''}"></span>
                            ${u.phone_number || '—'}
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            list.querySelectorAll('.user-item').forEach(el => {
                el.addEventListener('click', () => {
                    document.querySelectorAll('.user-item').forEach(i => i.classList.remove('active'));
                    el.classList.add('active');
                    openChat(el.dataset.id, el.dataset.name, el.dataset.phone, el.dataset.avatar, el.dataset.badge, el.dataset.online === 'true', false);
                });
            });
        }

        function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

        const searchInput = document.getElementById('searchInput');
        const searchResult = document.getElementById('searchResult');

        searchInput.addEventListener('input', (e) => {
            const q = e.target.value.trim();
            searchResult.className = 'search-result';
            searchResult.innerHTML = '';
            searchResult.onclick = null;
            if (!q) return;

            let matched;
            if (isOwner) {
                matched = allUsers.filter(u =>
                    (u.full_name || '').toLowerCase().includes(q.toLowerCase()) ||
                    (u.username || '').toLowerCase().includes(q.toLowerCase()) ||
                    (u.phone_number || '').includes(q)
                );
            } else {
                if (q.length < 6) return;
                matched = allUsers.filter(u => (u.phone_number || '') === q);
            }

            if (matched.length === 0) {
                if (!isOwner && q.length >= 6) {
                    searchResult.innerHTML = `<div style="font-size: 12px; color: var(--text-dim); padding: 10px;">Nomor "${q}" tidak ditemukan</div>`;
                    searchResult.classList.add('show');
                }
                return;
            }

            const u = matched[0];
            const online = isUserOnline(u.last_seen);
            searchResult.innerHTML = `
                ${avatarHTML(u)}
                <div class="user-meta">
                    <div class="user-name">${u.full_name || u.username}${badgeHTML(u.badge)}</div>
                    <div class="user-phone">
                        <span class="online-dot ${online ? 'online' : ''}"></span>
                        ${u.phone_number || '—'}
                    </div>
                </div>
            `;
            searchResult.style.display = 'flex';
            searchResult.style.padding = '10px';
            searchResult.style.margin = '0 15px 10px';
            searchResult.style.background = 'var(--glass)';
            searchResult.style.borderRadius = '8px';
            searchResult.style.cursor = 'pointer';
            searchResult.classList.add('show');
            
            searchResult.onclick = () => {
                openChat(u.id, u.full_name || u.username, u.phone_number, u.avatar_url, u.badge, online, false);
                searchResult.innerHTML = '';
                searchInput.value = '';
            };
        });

        async function openChat(id, name, phone, avatar, badge, isOnline, isGroup = false) {
            currentChatUser = { id, name, phone, avatar, isGroup };
            document.getElementById('emptyChat').style.display = 'none';
            document.getElementById('chatHeader').classList.add('show');
            document.getElementById('composer').classList.add('show');
            document.getElementById('chatName').innerHTML = name + (isGroup ? '' : badgeHTML(badge));
            
            document.getElementById('mainChat').classList.add('active-chat');
            
            const phoneHTML = isGroup ? 'Grup Chat' : `<span class="online-dot ${isOnline ? 'online' : ''}"></span> ${phone || '—'}`;
            document.getElementById('chatPhone').innerHTML = phoneHTML;

            const ca = document.getElementById('chatAvatar');
            if (avatar) {
                ca.style.backgroundImage = `url('${avatar}')`;
                ca.textContent = '';
            } else {
                ca.style.backgroundImage = 'none';
                ca.textContent = name.charAt(0).toUpperCase();
            }

            document.body.classList.add('show-chat');
            cancelReply(); 
            
            // Kalo group, ambil pesan berdasarkan group_id
            if (isGroup) {
                activeGroupId = id;
                await loadMessages(null, id);
            } else {
                activeGroupId = null;
                await loadMessages(id, null);
            }
            
            // Tandain udah dibaca (kalo private chat)
            if (!isGroup) {
                await sb.from('messages').update({ is_read: true }).eq('sender_id', id).eq('receiver_id', currentUser.id).eq('is_read', false);
            }

            if (messageSubscription) messageSubscription.unsubscribe();
            
            // Listener Realtime
            let filterQuery = isGroup ? `group_id=eq.${id}` : `or(and(sender_id.eq.${currentUser.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${currentUser.id}))`;
            
            messageSubscription = sb.channel('messages-realtime')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                    const m = payload.new;
                    const isRelevant = isGroup 
                        ? (m.group_id === id)
                        : ((m.sender_id === currentUser.id && m.receiver_id === id) || (m.sender_id === id && m.receiver_id === currentUser.id));
                        
                    if (isRelevant) {
                        appendMessage(m);
                        if (m.sender_id !== currentUser.id) {
                            playNotifSound();
                            if (!isGroup) sb.from('messages').update({ is_read: true }).eq('id', m.id);
                        }
                    }
                })
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, (payload) => {
                    const m = payload.new;
                    const el = document.querySelector(`.msg[data-id="${m.id}"]`);
                    
                    if (m.content === '[Pesan ini telah dihapus]' && el) {
                        el.style.display = 'none';
                    }
                    
                    if (m.is_read && el) {
                        const meta = el.querySelector('.msg-meta');
                        if (meta) meta.innerHTML = CHECK_SVG_2;
                    }
                })
                .subscribe();
        }

        async function loadMessages(otherId, groupId = null) {
            let query = sb.from('messages').select('*, reply:reply_to_id(content)').order('created_at', { ascending: true });
            
            if (groupId) {
                query = query.eq('group_id', groupId);
            } else {
                query = query.or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${currentUser.id})`);
            }
            
            const { data: messages } = await query;
            
            const { data: deletions } = await sb.from('message_deletions')
                .select('message_id')
                .eq('user_id', currentUser.id);
            
            const deletedIds = new Set((deletions || []).map(d => d.message_id));

            const box = document.getElementById('messages');
            box.innerHTML = '';
            
            if (messages) {
                messages.forEach(m => {
                    if (m.content === '[Pesan ini telah dihapus]') return;
                    if (deletedIds.has(m.id)) return;
                    appendMessage(m);
                });
            }
        }

        function createVoiceNoteHTML(url) {
            let barsHTML = '';
            for(let i=0; i<25; i++) {
                const height = Math.floor(Math.random() * 12) + 4;
                barsHTML += `<div class="bar" style="height:${height}px"></div>`;
            }
            return `
                <div class="vn-container">
                    <div class="vn-play-btn">${PLAY_SVG}</div>
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
                        <div class="vn-waveform">${barsHTML}</div>
                        <div class="vn-duration">0:00</div>
                    </div>
                </div>
                <audio class="vn-hidden-audio" src="${url}" preload="metadata"></audio>
            `;
        }

        function appendMessage(m, replyContent = null) {
            if (document.querySelector(`.msg[data-id="${m.id}"]`)) return;

            const box = document.getElementById('messages');
            const mine = m.sender_id === currentUser.id;
            const div = document.createElement('div');
            div.className = `msg ${mine ? 'mine' : 'theirs'}`;
            
            let replyHTML = '';
            const actualReplyContent = replyContent || (m.reply ? m.reply.content : null);

            if (m.reply_to_id && actualReplyContent) {
                const isReplyDeleted = actualReplyContent === '[Pesan ini telah dihapus]';
                const replyText = isReplyDeleted ? 'Pesan telah dihapus' : actualReplyContent;
                replyHTML = `
                    <div class="reply-preview">
                        <div class="reply-name">Balasan</div>
                        <div class="reply-text">${replyText}</div>
                    </div>
                `;
            }

            let bodyHTML = '';
            if (m.file_url && m.file_type === 'image') {
                bodyHTML = `<img src="${m.file_url}" alt="Gambar">`;
            } else if (m.file_url && m.file_type === 'audio') {
                bodyHTML = createVoiceNoteHTML(m.file_url);
            } else {
                bodyHTML = m.content;
            }

            const time = new Date(m.created_at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            let metaHTML = `<span>${time}</span>`;
            if (mine) {
                metaHTML += m.is_read ? CHECK_SVG_2 : CHECK_SVG_1;
            }

            div.innerHTML = `
                ${replyHTML}
                <div class="msg-body">${bodyHTML}</div>
                <div class="msg-meta">${metaHTML}</div>
            `;

            if (m.file_url && m.file_type === 'audio') setupAudioPlayer(div);
            div.dataset.id = m.id;

            div.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                showContextMenu(e.clientX, e.clientY, m);
            });

            let pressTimer;
            div.addEventListener('touchstart', (e) => {
                pressTimer = setTimeout(() => {
                    const touch = e.touches[0];
                    showContextMenu(touch.clientX, touch.clientY, m);
                    if (navigator.vibrate) navigator.vibrate(50);
                }, 400); 
            });
            div.addEventListener('touchend', () => clearTimeout(pressTimer));
            div.addEventListener('touchmove', () => clearTimeout(pressTimer));

            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function setupAudioPlayer(container) {
            const btn = container.querySelector('.vn-play-btn');
            const audio = container.querySelector('.vn-hidden-audio');
            const durationText = container.querySelector('.vn-duration');
            const bars = container.querySelectorAll('.vn-waveform .bar');
            
            audio.addEventListener('loadedmetadata', () => {
                const mins = Math.floor(audio.duration / 60);
                const secs = Math.floor(audio.duration % 60);
                durationText.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            });

            btn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                document.querySelectorAll('.vn-hidden-audio').forEach(a => {
                    if (a !== audio) { a.pause(); a.currentTime = 0; }
                    const otherBtn = a.closest('.vn-container')?.querySelector('.vn-play-btn');
                    if (otherBtn) otherBtn.innerHTML = PLAY_SVG;
                });

                if (audio.paused) {
                    audio.play();
                    btn.innerHTML = PAUSE_SVG;
                } else {
                    audio.pause();
                    btn.innerHTML = PLAY_SVG;
                }
            });

            audio.addEventListener('timeupdate', () => {
                const progress = (audio.currentTime / audio.duration);
                const activeBars = Math.floor(progress * bars.length);
                bars.forEach((bar, i) => {
                    bar.style.opacity = i <= activeBars ? '1' : '0.3';
                });
            });

            audio.addEventListener('ended', () => {
                btn.innerHTML = PLAY_SVG;
                bars.forEach(bar => bar.style.opacity = '0.3');
            });
        }

        const ctxMenu = document.getElementById('ctxMenu');
        
        function showContextMenu(x, y, msgData) {
            if (msgData.content === '[Pesan ini telah dihapus]') return;
            activeMessage = msgData;
            const isMine = msgData.sender_id === currentUser.id;

            document.getElementById('ctxDeleteAll').style.display = isMine ? 'flex' : 'none';
            
            const menuW = 180, menuH = isMine ? 130 : 80;
            if (x + menuW > window.innerWidth) x -= menuW;
            if (y + menuH > window.innerHeight) y -= menuH;

            ctxMenu.style.left = x + 'px';
            ctxMenu.style.top = y + 'px';
            ctxMenu.classList.add('show');
        }

        document.addEventListener('click', (e) => {
            if (!ctxMenu.contains(e.target)) ctxMenu.classList.remove('show');
        });

        document.addEventListener('contextmenu', (e) => {
            if (!e.target.closest('.msg')) e.preventDefault(); 
        });

        document.getElementById('ctxReply').addEventListener('click', () => {
            if (!activeMessage) return;
            ctxMenu.classList.remove('show');
            replyingTo = activeMessage;
            
            document.getElementById('replyText').textContent = activeMessage.content || (activeMessage.file_type === 'image' ? '[Gambar]' : '[Voice Note]');
            document.getElementById('replyBar').classList.add('show');
            document.getElementById('messageInput').focus();
        });

        function cancelReply() {
            replyingTo = null;
            document.getElementById('replyBar').classList.remove('show');
        }

        document.getElementById('cancelReply').addEventListener('click', cancelReply);

        document.getElementById('ctxDeleteAll').addEventListener('click', () => {
            ctxMenu.classList.remove('show');
            showModal('Hapus untuk semua?', 'Pesan ini akan hilang dari layar kamu dan lawan bicara.', 'Hapus', 'danger', async () => {
                const m = activeMessage;
                const el = document.querySelector(`.msg[data-id="${m.id}"]`);
                await sb.from('messages').update({ content: '[Pesan ini telah dihapus]' }).eq('id', m.id);
                if (el) el.style.display = 'none';
            });
        });

        document.getElementById('ctxDeleteMe').addEventListener('click', () => {
            ctxMenu.classList.remove('show');
            showModal('Hapus pesan?', 'Pesan ini hanya akan hilang dari layar kamu sendiri.', 'Hapus', 'danger', async () => {
                const m = activeMessage;
                const el = document.querySelector(`.msg[data-id="${m.id}"]`);
                await sb.from('message_deletions').insert({ message_id: m.id, user_id: currentUser.id });
                if (el) el.remove();
            });
        });

        // === UPLOAD GAMBAR ===
        document.getElementById('attachBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !currentChatUser) return;
            
            const ext = file.name.split('.').pop();
            const fileName = `${currentUser.id}/${Date.now()}.${ext}`;
            
            const { error: upErr } = await sb.storage.from('chat_uploads').upload(fileName, file);
            if (upErr) {
                showModal('Gagal Upload', upErr.message, 'Tutup', 'primary', null);
                return;
            }
            
            const { data: urlData } = sb.storage.from('chat_uploads').getPublicUrl(fileName);
            
            const { data: insertedMsg, error: insErr } = await sb.from('messages').insert({
                sender_id: currentUser.id,
                receiver_id: currentChatUser.isGroup ? null : currentChatUser.id,
                group_id: currentChatUser.isGroup ? currentChatUser.id : null,
                content: '',
                file_url: urlData.publicUrl,
                file_type: 'image',
                reply_to_id: replyingTo ? replyingTo.id : null
            }).select().single();

            if (!insErr && insertedMsg) {
                appendMessage(insertedMsg, replyingTo ? (replyingTo.content || (replyingTo.file_type === 'image' ? '[Gambar]' : '[Voice Note]')) : null);
            }

            cancelReply();
            e.target.value = ''; 
        });

        // === REKAM VN ===
        const recordBtn = document.getElementById('recordBtn');
        
        recordBtn.addEventListener('click', async () => {
            if (!currentChatUser) return;

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) audioChunks.push(e.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const fileName = `${currentUser.id}/${Date.now()}.webm`;
                        
                        recordBtn.classList.remove('recording');
                        isRecording = false;
                        recordBtn.title = "Rekam Suara";

                        const { error: upErr } = await sb.storage.from('chat_uploads').upload(fileName, audioBlob);
                        if (upErr) {
                            showModal('Gagal Upload VN', upErr.message, 'Tutup', 'primary', null);
                            return;
                        }

                        const { data: urlData } = sb.storage.from('chat_uploads').getPublicUrl(fileName);
                        
                        const { data: insertedMsg, error: insErr } = await sb.from('messages').insert({
                            sender_id: currentUser.id,
                            receiver_id: currentChatUser.isGroup ? null : currentChatUser.id,
                            group_id: currentChatUser.isGroup ? currentChatUser.id : null,
                            content: '',
                            file_url: urlData.publicUrl,
                            file_type: 'audio',
                            reply_to_id: replyingTo ? replyingTo.id : null
                        }).select().single();

                        if (!insErr && insertedMsg) {
                            appendMessage(insertedMsg, replyingTo ? (replyingTo.content || (replyingTo.file_type === 'image' ? '[Gambar]' : '[Voice Note]')) : null);
                        }

                        cancelReply();
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    recordBtn.title = "Merekam... Klik lagi buat kirim";

                    recordingTimeout = setTimeout(() => {
                        if (isRecording) mediaRecorder.stop();
                    }, 60000);

                } catch (err) {
                    showModal('Akses Ditolak', 'Pastikan lo ngasih izin mikrofon di browser.', 'Tutup', 'primary', null);
                }
            } else {
                clearTimeout(recordingTimeout);
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }
            }
        });

        // === KIRIM PESAN ===
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !currentChatUser) return;
            
            input.value = '';
            const { matched, severity } = detectToxic(content);
            
            if (matched.length > 0) {
                await sb.from('moderation_logs').insert({
                    sender_id: currentUser.id,
                    receiver_id: currentChatUser.isGroup ? null : currentChatUser.id,
                    content: content,
                    matched_words: matched,
                    severity: severity
                });
                if (severity === 'high') showToxicWarning();
            }

            const { data: insertedMsg, error: insErr } = await sb.from('messages').insert({
                sender_id: currentUser.id,
                receiver_id: currentChatUser.isGroup ? null : currentChatUser.id,
                group_id: currentChatUser.isGroup ? currentChatUser.id : null,
                content,
                reply_to_id: replyingTo ? replyingTo.id : null
            }).select().single();

            if (!insErr && insertedMsg) {
                appendMessage(insertedMsg, replyingTo ? (replyingTo.content || (replyingTo.file_type === 'image' ? '[Gambar]' : '[Voice Note]')) : null);
            } else if (insErr) {
                console.error('Gagal kirim pesan:', insErr);
            }
            
            cancelReply();
        }

        function showToxicWarning() {
            const existing = document.getElementById('toxicWarn');
            if (existing) existing.remove();
            const warn = document.createElement('div');
            warn.id = 'toxicWarn';
            warn.textContent = 'Pesanmu terdeteksi mengandung kata tidak pantas. Pesan ini dicatat.';
            warn.style.cssText = `
                position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
                background: rgba(31, 17, 22, 0.8); border: 1px solid #ff4757; color: #ff8a94;
                padding: 10px 16px; border-radius: 8px; font-size: 12px;
                font-family: 'Space Grotesk', sans-serif; z-index: 9999;
                box-shadow: 0 8px 24px rgba(255,71,87,0.25);
                backdrop-filter: blur(10px); max-width: 90%; text-align: center; pointer-events: none;
            `;
            document.body.appendChild(warn);
            setTimeout(() => warn.remove(), 4000);
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await sb.auth.signOut();
            window.location.href = 'index.html';
        });

        // === STATUS LOAD ===
        async function loadStatuses() {
            const container = document.getElementById('statusList');
            container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-mute);">Memuat...</div>';

            const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const { data: statuses } = await sb.from('status')
                .select('*, profiles(full_name, avatar_url)')
                .gte('created_at', yesterday)
                .order('created_at', { ascending: false });

            if (!statuses || statuses.length === 0) {
                container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-mute);">Belum ada status.</div>';
                return;
            }

            container.innerHTML = statuses.map(s => {
                const name = s.profiles?.full_name || 'User';
                const avatar = s.profiles?.avatar_url || '';
                const avatarHTML = avatar ? `<div class="avatar" style="background-image:url('${avatar}');"></div>` : `<div class="avatar">${name.charAt(0)}</div>`;
                
                const isMine = s.user_id === currentUser.id;
                
                return `
                <div class="user-item" onclick="viewStatus('${s.id}', '${name}', '${s.file_url}', ${isMine})">
                    ${avatarHTML}
                    <div class="user-meta">
                        <div class="user-name">${name}</div>
                        <div class="user-phone">${new Date(s.created_at).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function viewStatus(id, name, fileUrl, isMine) {
            const viewer = document.getElementById('statusViewer');
            document.getElementById('viewerName').textContent = name;
            document.getElementById('statusContent').innerHTML = `<img src="${fileUrl}" style="max-width:100%; max-height:80vh;">`;
            
            activeStatusId = id;
            if (isMine) {
                document.getElementById('deleteStatusBtn').style.display = 'block';
            } else {
                document.getElementById('deleteStatusBtn').style.display = 'none';
            }
            
            viewer.classList.add('show');

            const progress = document.getElementById('statusProgress');
            progress.innerHTML = `<div class="status-bar"><div class="status-bar-fill" style="animation: fillBar 5s linear forwards;"></div></div>`;
            
            setTimeout(() => { viewer.classList.remove('show'); }, 5000);
        }

        document.getElementById('closeViewer').addEventListener('click', () => {
            document.getElementById('statusViewer').classList.remove('show');
        });

        init();
    </script>
</body>
</html>
