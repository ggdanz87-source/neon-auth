<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerozx Neon Auth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Neon -->
    <div class="bg-wrap">
        <div class="neon-blob blob-a"></div>
        <div class="neon-blob blob-b"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Card Auth -->
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/>
                        <path d="M12 22V12M3 7l9 5 9-5"/>
                    </svg>
                </div>
                <h1>ZEROZX</h1>
                <p>Neon Auth System</p>
            </div>

            <div class="tabs" data-active="login">
                <button class="tab active" data-tab="login">Login</button>
                <button class="tab" data-tab="register">Register</button>
                <div class="tab-slider"></div>
            </div>

            <!-- FORM LOGIN -->
            <form class="form active" id="loginForm">
                <div class="input-group">
                    <input type="email" id="loginEmail" placeholder=" " required>
                    <label>Email</label>
                </div>
                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder=" " required>
                    <label>Password</label>
                </div>
                <button type="submit" class="btn-submit">
                    <span class="btn-text">MASUK</span>
                    <span class="btn-loader"></span>
                </button>
                <div class="msg" id="loginMsg"></div>
            </form>

            <!-- FORM REGISTER -->
            <form class="form" id="registerForm">
                <div class="input-group">
                    <input type="text" id="regName" placeholder=" " required>
                    <label>Nama Lengkap</label>
                </div>
                <div class="input-group">
                    <input type="email" id="regEmail" placeholder=" " required>
                    <label>Email</label>
                </div>
                <div class="input-group">
                    <input type="password" id="regPassword" placeholder=" " required>
                    <label>Password</label>
                </div>
                <button type="submit" class="btn-submit">
                    <span class="btn-text">DAFTAR</span>
                    <span class="btn-loader"></span>
                </button>
                <div class="msg" id="registerMsg"></div>
            </form>
        </div>
    </div>

    <!-- Load Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
