<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Owner — Zerozx Neon</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #050508; --card: rgba(10, 10, 15, 0.85); --border: rgba(0, 150, 255, 0.2);
            --text: #e0e0e0; --text-dim: #7a7a85; --neon: #00d4ff;
            --red: #e53935; --blue: #1e88e5;
        }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 40px 20px;
            background: radial-gradient(circle at top right, #1f0000 0%, #050508 50%);
        }
        .card {
            background: var(--card); backdrop-filter: blur(20px);
            border: 1px solid rgba(229, 57, 53, 0.3);
            border-radius: 20px; padding: 40px; max-width: 700px; margin: auto;
            box-shadow: 0 0 40px rgba(229, 57, 53, 0.15);
        }
        h1 {
            font-family: 'Orbitron', sans-serif; color: var(--red); text-align: center;
            margin-bottom: 10px; font-size: 24px; text-shadow: 0 0 15px rgba(229,57,53,0.5);
        }
        .subtitle { text-align: center; color: var(--text-dim); font-size: 13px; margin-bottom: 30px; }

        .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .input-row input {
            flex: 1; padding: 14px; background: rgba(0,0,0,0.5);
            border: 1px solid var(--border); border-radius: 10px;
            color: #fff; font-family: inherit; outline: none;
        }
        .input-row input:focus { border-color: var(--neon); }

        .btn {
            padding: 14px 24px; border: none; border-radius: 10px;
            font-family: inherit; font-weight: 800; cursor: pointer;
            transition: 0.3s; font-size: 13px;
        }
        .btn-blue { background: linear-gradient(135deg, #1565c0, var(--blue)); color: #fff; }
        .btn-blue:hover { box-shadow: 0 0 20px var(--blue); }
        .btn-red { background: transparent; border: 1px solid var(--red); color: var(--red); }
        .btn-red:hover { background: var(--red); color: #000; }

        .msg { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 13px; text-align: center; }
        .msg.ok { display: block; background: rgba(0,255,136,0.1); color: #00ff88; border: 1px solid #00ff88; }
        .msg.err { display: block; background: rgba(255,68,68,0.1); color: #ff4444; border: 1px solid #ff4444; }

        .user-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; border-radius: 10px; background: rgba(0,0,0,0.3);
            margin-bottom: 8px; border: 1px solid var(--border);
        }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, #0088cc, var(--neon));
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #000; flex-shrink: 0;
            background-size: cover; background-position: center;
        }
        .info { flex: 1; min-width: 0; }
        .info .name { font-weight: 600; color: #fff; display: flex; align-items: center; }
        .info .phone { font-size: 11px; color: var(--text-dim); }
        .badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; border-radius: 50%;
            font-size: 10px; color: #fff; font-weight: bold;
            margin-left: 4px;
        }
        .badge-red { background: var(--red); }
        .badge-blue { background: var(--blue); }

        .back-link { display: block; text-align: center; margin-top: 25px; color: var(--text-dim); text-decoration: none; font-size: 13px; }
        .back-link:hover { color: var(--neon); }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔴 PANEL OWNER</h1>
        <p class="subtitle">Kasih / cabut centang biru berdasarkan nomor user</p>

        <div class="msg" id="msgBox"></div>

        <div class="input-row">
            <input type="text" id="targetPhone" placeholder="Nomor target (08xxxx...)" />
            <button class="btn btn-blue" onclick="giveBlue()">✓ Kasih Biru</button>
        </div>

        <div class="input-row">
            <input type="text" id="revokePhone" placeholder="Nomor target (buat cabut)" />
            <button class="btn btn-red" onclick="revokeBlue()">✗ Cabut</button>
        </div>

        <h3 style="margin: 30px 0 15px; color: var(--neon); font-size: 14px;">Daftar User</h3>
        <div id="userList" style="max-height: 400px; overflow-y: auto;">
            <div style="text-align:center; padding:20px; color:var(--text-dim); font-size:12px;">Memuat...</div>
        </div>

        <a href="dashboard.html" class="back-link">← Balik ke Chat</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hlhlpznffrnuvxgcuwiu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__Xm9KHWul4yOcvbH9cPAGg_h_A4s0_O';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showMsg(text, type) {
            const el = document.getElementById('msgBox');
            el.textContent = text;
            el.className = `msg ${type}`;
            setTimeout(() => { el.className = 'msg'; }, 4000);
        }

        function badgeHTML(badge) {
            if (badge === 'red') return '<span class="badge badge-red">✓</span>';
            if (badge === 'blue') return '<span class="badge badge-blue">✓</span>';
            return '';
        }

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            const { data: profile } = await sb.from('profiles')
                .select('badge').eq('id', session.user.id).single();

            if (profile?.badge !== 'red') {
                alert('Halaman ini khusus owner!');
                window.location.href = 'dashboard.html';
                return;
            }

            loadUsers();
        }

        async function loadUsers() {
            const { data, error } = await sb.rpc('list_users_for_owner');
            const list = document.getElementById('userList');

            if (error) {
                list.innerHTML = `<div style="color:#ff4444;font-size:12px;">${error.message}</div>`;
                return;
            }
            if (!data || data.length === 0) {
                list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-dim);font-size:12px;">Belum ada user.</div>';
                return;
            }

            list.innerHTML = data.map(u => {
                const avatarStyle = u.avatar_url ? `background-image:url('${u.avatar_url}'); color: transparent;` : '';
                const avatarText = u.avatar_url ? '' : (u.full_name || 'U').charAt(0).toUpperCase();

                return `
                <div class="user-item">
                    <div class="avatar" style="${avatarStyle}">${avatarText}</div>
                    <div class="info">
                        <div class="name">${u.full_name || 'User'} ${badgeHTML(u.badge)}</div>
                        <div class="phone">${u.phone_number || '-'}</div>
                    </div>
                </div>`;
            }).join('');
        }

        async function giveBlue() {
            const phone = document.getElementById('targetPhone').value.trim();
            if (!phone) return showMsg('Isi nomor target dulu', 'err');

            const { data, error } = await sb.rpc('give_blue_badge', { target_phone: phone });
            if (error) return showMsg(error.message, 'err');
            if (!data.ok) return showMsg(data.error, 'err');

            showMsg('✅ ' + data.message, 'ok');
            document.getElementById('targetPhone').value = '';
            loadUsers();
        }

        async function revokeBlue() {
            const phone = document.getElementById('revokePhone').value.trim();
            if (!phone) return showMsg('Isi nomor target dulu', 'err');

            const { data, error } = await sb.rpc('revoke_blue_badge', { target_phone: phone });
            if (error) return showMsg(error.message, 'err');
            if (!data.ok) return showMsg(data.error, 'err');

            showMsg('✅ ' + data.message, 'ok');
            document.getElementById('revokePhone').value = '';
            loadUsers();
        }

        init();
    </script>
</body>
</html>
