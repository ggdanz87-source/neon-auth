<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Owner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg:        #08090c;
            --surface:   #0f1116;
            --surface-2: #14171e;
            --line:      #1e232d;
            --line-hi:   #2a3140;
            --text:      #e8ecf2;
            --text-dim:  #7b8493;
            --text-mute: #4d5563;
            --accent:    #4cc9f0;
            --accent-dim:#1d6d85;
            --red:       #ff4757;
            --blue:      #3a86ff;
            --success:   #2ec4b6;
        }

        body {
            font-family: 'Space Grotesk', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 50% at 50% -10%, rgba(255, 71, 87, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(76, 201, 240, 0.05), transparent);
            pointer-events: none;
        }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 680px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line);
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }
        .header-title svg {
            width: 18px;
            height: 18px;
            color: var(--red);
        }
        .header-sub {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 6px;
            margin-left: 28px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 12.5px;
            margin-bottom: 18px;
            transition: color 0.15s;
        }
        .back-btn:hover { color: var(--accent); }
        .back-btn svg { width: 13px; height: 13px; }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-mute);
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title svg {
            width: 12px;
            height: 12px;
        }
        .count-pill {
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            padding: 1px 7px;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 0;
        }

        .input-row { display: flex; gap: 8px; }
        .input-row input {
            flex: 1;
            padding: 11px 14px;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s;
        }
        .input-row input::placeholder { color: var(--text-mute); font-family: inherit; }
        .input-row input:focus { border-color: var(--accent-dim); }

        .btn {
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn svg { width: 13px; height: 13px; }
        .btn-primary {
            background: var(--accent);
            color: #04121a;
        }
        .btn-primary:hover { background: #6ad5f5; }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:disabled {
            background: var(--accent-dim);
            color: var(--text-mute);
            cursor: not-allowed;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--text-dim);
            padding: 7px 12px;
            font-size: 11.5px;
        }
        .btn-ghost:hover {
            border-color: var(--red);
            color: var(--red);
            background: rgba(255, 71, 87, 0.05);
        }

        .msg {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 12.5px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .msg svg { width: 14px; height: 14px; flex-shrink: 0; }
        .msg.ok {
            display: flex;
            background: rgba(46, 196, 182, 0.08);
            color: var(--success);
            border: 1px solid rgba(46, 196, 182, 0.3);
        }
        .msg.err {
            display: flex;
            background: rgba(255, 71, 87, 0.08);
            color: var(--red);
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        .user-row {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px;
            border-radius: 9px;
            background: var(--bg);
            border: 1px solid var(--line);
            margin-bottom: 8px;
            transition: border-color 0.15s;
        }
        .user-row:hover { border-color: var(--line-hi); }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 13px;
            color: var(--accent);
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .u-meta { flex: 1; min-width: 0; }
        .u-name {
            font-weight: 500;
            font-size: 13.5px;
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text);
        }
        .u-phone {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .badge svg { width: 9px; height: 9px; color: #fff; }
        .badge.red { background: var(--red); }
        .badge.blue { background: var(--blue); }

        .empty-state {
            padding: 28px 16px;
            text-align: center;
            color: var(--text-mute);
            font-size: 12.5px;
            line-height: 1.5;
        }
        .empty-state svg {
            width: 26px;
            height: 26px;
            color: var(--line-hi);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="dashboard.html" class="back-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            Kembali ke chat
        </a>

        <div class="header">
            <div class="header-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21l2-7.5L2 9h7l3-7z"/>
                </svg>
                Panel Owner
            </div>
            <div class="header-sub">Kelola verifikasi pengguna</div>
        </div>

        <div class="msg" id="msgBox"></div>

        <!-- Kasih centang biru -->
        <div class="card">
            <div class="card-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                Beri verifikasi
            </div>
            <div class="input-row">
                <input type="text" id="targetPhone" placeholder="Nomor pengguna">
                <button class="btn btn-primary" id="giveBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Verifikasi
                </button>
            </div>
        </div>

        <!-- User terverifikasi -->
        <div class="card">
            <div class="card-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="16 12 12 16 8 12"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                </svg>
                Terverifikasi
                <span class="count-pill" id="blueCount">0</span>
            </div>
            <div id="blueList">
                <div class="empty-state">Memuat</div>
            </div>
        </div>

        <!-- Semua user -->
        <div class="card">
            <div class="card-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 00-3-3.87"/>
                    <path d="M16 3.13a4 4 0 010 7.75"/>
                </svg>
                Semua pengguna
            </div>
            <div id="allList">
                <div class="empty-state">Memuat</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hlhlpznffrnuvxgcuwiu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__Xm9KHWul4yOcvbH9cPAGg_h_A4s0_O';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

        function showMsg(text, type) {
            const el = document.getElementById('msgBox');
            const icon = type === 'ok'
                ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
                : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
            el.innerHTML = icon + '<span>' + text + '</span>';
            el.className = 'msg ' + type;
            setTimeout(() => { el.className = 'msg'; }, 4000);
        }

        function badgeHTML(badge) {
            if (badge === 'red')  return `<span class="badge red" title="Owner">${CHECK_SVG}</span>`;
            if (badge === 'blue') return `<span class="badge blue" title="Terverifikasi">${CHECK_SVG}</span>`;
            return '';
        }

        function avatarHTML(u) {
            if (u.avatar_url) return `<div class="avatar" style="background-image:url('${u.avatar_url}'); color:transparent;"></div>`;
            return `<div class="avatar">${(u.full_name || 'U').charAt(0).toUpperCase()}</div>`;
        }

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            const { data: profile } = await sb.from('profiles').select('badge').eq('id', session.user.id).single();
            if (profile?.badge !== 'red') {
                window.location.href = 'dashboard.html';
                return;
            }
            loadUsers();
        }

        async function loadUsers() {
            const { data, error } = await sb.rpc('list_users_for_owner');
            if (error) {
                document.getElementById('blueList').innerHTML = `<div class="empty-state" style="color:var(--red);">${error.message}</div>`;
                document.getElementById('allList').innerHTML = `<div class="empty-state" style="color:var(--red);">${error.message}</div>`;
                return;
            }

            const users = data || [];
            const blueUsers = users.filter(u => u.badge === 'blue');
            document.getElementById('blueCount').textContent = blueUsers.length;

            // Blue list
            const blueList = document.getElementById('blueList');
            if (blueUsers.length === 0) {
                blueList.innerHTML = `<div class="empty-state">Belum ada pengguna terverifikasi.</div>`;
            } else {
                blueList.innerHTML = blueUsers.map(u => `
                    <div class="user-row">
                        ${avatarHTML(u)}
                        <div class="u-meta">
                            <div class="u-name">${u.full_name || 'User'} ${badgeHTML(u.badge)}</div>
                            <div class="u-phone">${u.phone_number || '—'}</div>
                        </div>
                        <button class="btn btn-ghost" onclick="cabut('${u.phone_number}')">Cabut</button>
                    </div>
                `).join('');
            }

            // All list
            const allList = document.getElementById('allList');
            if (users.length === 0) {
                allList.innerHTML = `<div class="empty-state">Belum ada pengguna.</div>`;
            } else {
                allList.innerHTML = users.map(u => `
                    <div class="user-row">
                        ${avatarHTML(u)}
                        <div class="u-meta">
                            <div class="u-name">${u.full_name || 'User'} ${badgeHTML(u.badge)}</div>
                            <div class="u-phone">${u.phone_number || '—'}</div>
                        </div>
                    </div>
                `).join('');
            }
        }

        document.getElementById('giveBtn').addEventListener('click', async () => {
            const input = document.getElementById('targetPhone');
            const phone = input.value.trim();
            if (!phone) return showMsg('Masukkan nomor pengguna', 'err');

            const { data, error } = await sb.rpc('give_blue_badge', { target_phone: phone });
            if (error) return showMsg(error.message, 'err');
            if (!data.ok) return showMsg(data.error, 'err');

            showMsg(data.message, 'ok');
            input.value = '';
            loadUsers();
        });

        document.getElementById('targetPhone').addEventListener('keypress', e => {
            if (e.key === 'Enter') document.getElementById('giveBtn').click();
        });

        async function cabut(phone) {
            if (!confirm(`Cabut verifikasi dari ${phone}?`)) return;
            const { data, error } = await sb.rpc('revoke_blue_badge', { target_phone: phone });
            if (error) return showMsg(error.message, 'err');
            if (!data.ok) return showMsg(data.error, 'err');
            showMsg(data.message, 'ok');
            loadUsers();
        }

        init();
    </script>
</body>
</html>
